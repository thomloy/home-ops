---
name: "Image Scan"

on:
  pull_request:
    branches: ["main"]
    paths:
      - "kubernetes/**.yaml"
      - "kubernetes/**.yml"
      - ".github/workflows/image-scan.yaml"
      - ".github/scripts/extract_changed_images.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  list-images:
    name: List changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
      count: ${{ steps.extract.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@e0021407031f5be11a464abee9a0776171c79891  # v47.0.1
        with:
          files: |
            kubernetes/**/*.yaml
            kubernetes/**/*.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Extract image refs from changed files
        id: extract
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # tj-actions emits space-separated paths; one per line for the script
          export CHANGED_FILES=$(echo "$CHANGED_FILES" | tr ' ' '\n')
          mapfile -t imgs < <(python3 .github/scripts/extract_changed_images.py)
          count=${#imgs[@]}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "images=[]" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${imgs[@]}"
            json=$(printf '%s\n' "${imgs[@]}" | jq -R . | jq -cs .)
            echo "images=$json" >> "$GITHUB_OUTPUT"
          fi

  scan:
    name: "Trivy: ${{ matrix.image }}"
    needs: list-images
    if: ${{ needs.list-images.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list-images.outputs.images) }}
    steps:
      # The scan job needs the repo checked out so trivy can read .trivyignore
      # (trivyignores below). Without this the workspace is empty and trivy
      # errors "cannot find ignorefile '.trivyignore'".
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.71.1
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          # Report-only. These are upstream images we consume, not build, so a
          # finding isn't ours to fix — gating here would just block Renovate
          # auto-merges on CVEs we can't patch. exit-code 0 = never fail on
          # vulns; results go to the Security tab (uploaded below) for triage.
          exit-code: "0"
          vuln-type: "os,library"
          timeout: "5m"
          trivyignores: ".trivyignore"
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: "trivy-results.sarif"
          # One category per image so matrix uploads don't overwrite each other.
          category: "trivy:${{ matrix.image }}"

  scan-status:
    name: Image Scan Success
    needs: ["list-images", "scan"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any scans failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: Scans completed?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "Image scans completed (report-only — see the Security tab for findings)"
