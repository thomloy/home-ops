---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nut-client
configFiles:
  - content: |
      MONITOR ups@${NAS_IP} 1 upsmon ${NUT_UPSMON_PASSWORD} secondary
      MINSUPPLIES 0
      SHUTDOWNCMD "/sbin/poweroff"
      POLLFREQ 5
      POLLFREQALERT 5
      HOSTSYNC 15
      DEADTIME 300
      FINALDELAY 5
    mountPath: /usr/local/etc/nut/upsmon.conf
