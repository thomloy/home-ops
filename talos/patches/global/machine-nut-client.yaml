---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: nut-client
configFiles:
  - content: |
      MONITOR ups@192.168.42.44 1 upsmon upsmon secondary
      MINSUPPLIES 1
      SHUTDOWNCMD "/sbin/poweroff"
      POLLFREQ 5
      POLLFREQALERT 5
      HOSTSYNC 15
      DEADTIME 15
      FINALDELAY 5
    mountPath: /usr/local/etc/nut/upsmon.conf
