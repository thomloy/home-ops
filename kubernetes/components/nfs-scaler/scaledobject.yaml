---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}
spec:
  advanced:
    restoreToOriginalReplicaCount: true
  # Grace period before scaling back to 0 once the NFS probe goes inactive. The
  # NAS probe (192.168.42.44:2049) flaps on brief NAS/UPS hiccups; with 0 the
  # apps scaled to 0 instantly and downstream things broke (arrem-sync couldn't
  # reach Emby, navidrome 503'd). 30 min rides out blips while still scaling to 0
  # for a real, sustained NAS outage.
  cooldownPeriod: 1800
  fallback:
    failureThreshold: 3
    replicas: 1
  minReplicaCount: 0
  maxReplicaCount: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: ${CONTROLLER:=Deployment}
    name: ${APP}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.observability.svc.cluster.local:9090
        query: max_over_time(probe_success{instance=~".+:2049"}[1m])
        threshold: "1"
        ignoreNullValues: "true"
