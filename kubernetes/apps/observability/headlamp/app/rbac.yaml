---
# Login identity for the Headlamp UI. Headlamp forwards the token pasted at
# login to the API server, so the pod's own ServiceAccount stays unprivileged.
#   kubectl -n observability create token headlamp-admin --duration=24h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: observability
