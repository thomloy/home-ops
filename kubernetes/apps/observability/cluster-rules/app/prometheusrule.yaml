---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-backup-disk-rules
spec:
  groups:
    # =========================
    # Backups VolSync (Kopia → NFS)
    # =========================
    - name: volsync.rules
      rules:
        - alert: VolSyncBackupStale
          # 1 = la source est en retard sur son planning (sync manquée)
          expr: |
            volsync_volume_out_of_sync == 1
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Backup VolSync en retard"
            description: "Le backup VolSync {{ $labels.obj_namespace }}/{{ $labels.obj_name }} est en retard sur son planning depuis plus de 6h."

    # =========================
    # Backups CNPG (Postgres → R2) — via le statut des Backup CRs (KSM CRS).
    # Fiable quelle que soit la méthode (plugin barman / volumeSnapshot),
    # contrairement à cnpg_collector_*_backup_timestamp (non màj par le plugin).
    # =========================
    - name: cnpg-backup.rules
      rules:
        - alert: CNPGBackupStale
          # Le ScheduledBackup CNPG est HEBDOMADAIRE (0 0 3 * * 0, dimanche 3h)
          # + WAL archivé en continu pour le PITR. On alerte donc à >8j (semaine
          # + 1j de grâce), pas à 36h, sinon faux positif chaque semaine.
          expr: |
            time() - max by (cluster, namespace) (cnpg_backup_created{phase="completed"}) > 691200
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Backup CNPG périmé"
            description: "Aucun backup CNPG réussi depuis plus de 36h pour le cluster {{ $labels.cluster }} ({{ $labels.namespace }})."

        - alert: CNPGBackupFailed
          # le backup le plus récent a échoué (failed plus récent que completed)
          expr: |
            max by (cluster, namespace) (cnpg_backup_created{phase="failed"})
            > max by (cluster, namespace) (cnpg_backup_created{phase="completed"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Backup CNPG en échec"
            description: "Le dernier backup du cluster CNPG {{ $labels.cluster }} ({{ $labels.namespace }}) a échoué et aucun n'a réussi depuis."

    # =========================
    # WAL CNPG — détection de la rétention par slot inactif.
    # Le 2026-07-20, la réplique nextcloud-postgres-5 (divergée sur sa timeline)
    # a crashloopé 7j en gardant son slot déclaré mais inactif : ~14GB de WAL
    # empilés pour une base de 42MB, volume saturé, cluster entier à terre.
    # max_slot_wal_keep_size=4GB est le garde-fou ; ces alertes préviennent AVANT
    # qu'il ne se déclenche, pour re-cloner la réplique sans perdre le slot.
    # =========================
    - name: cnpg-wal.rules
      rules:
        - alert: CNPGReplicationSlotInactive
          # Chaque instance publie la métrique pour TOUS les slots du cluster :
          # les répliques rapportent 0 pour les slots qu'elles ne possèdent pas.
          # Un `== 0` nu fanionnerait donc en permanence. Le max by() dit "aucune
          # instance ne voit ce slot actif", seul cas qui compte réellement.
          expr: |
            max by (namespace, job, slot_name) (cnpg_pg_replication_slots_active) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Slot de réplication CNPG inactif"
            description: "Le slot {{ $labels.slot_name }} ({{ $labels.namespace }}/{{ $labels.job }}) est inactif depuis plus de 30min et retient du WAL. Vérifier la réplique correspondante — si elle est morte, la re-cloner (delete PVC + pod)."

        - alert: CNPGWalVolumeGrowing
          # Régime normal ~0.6-1.5GB (max_wal_size=1GB, wal_keep_size=512MB).
          # 3GB = anomalie franche, et laisse 1GB de marge avant que le plafond
          # max_slot_wal_keep_size (4GB) n'invalide un slot.
          expr: |
            cnpg_collector_pg_wal{value="size"} > 3e9
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "WAL CNPG en accumulation"
            description: "Le pg_wal de {{ $labels.pod }} ({{ $labels.namespace }}) fait {{ $value | humanize1024 }}B, bien au-delà du régime normal. Slot inactif ou archivage bloqué — le plafond de 4GB va invalider un slot si ça continue."

    # =========================
    # Disque OS des nodes Talos (cache containerd)
    # =========================
    - name: node-disk.rules
      rules:
        - alert: TalosOSDiskFillingUp
          # /var = partition EPHEMERAL Talos (cache images containerd). Le GC
          # kubelet purge à 70% ; à 80% c'est qu'il ne suit pas. Exclut le NAS.
          expr: |
            100 * (1 - node_filesystem_avail_bytes{instance!="${NAS_IP}:9100",mountpoint="/var"}
            / node_filesystem_size_bytes{instance!="${NAS_IP}:9100",mountpoint="/var"}) > 80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Disque OS Talos > 80%"
            description: "Le disque OS (/var, cache containerd) de {{ $labels.instance }} est à {{ $value | printf \"%.0f\" }}% — le GC d'images (seuil 70%) ne suit peut-être pas."

        - alert: NodeMemoryHigh
          # Remplace la native NodeMemoryHighUtilization (désactivée) : exclut le
          # NAS dont l'ARC ZFS (~94%) est réclamable et déclenchait un faux positif.
          expr: |
            100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter",instance!="${NAS_IP}:9100"}
            / node_memory_MemTotal_bytes{job="node-exporter",instance!="${NAS_IP}:9100"}) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Mémoire node élevée"
            description: "{{ $labels.instance }} utilise {{ $value | printf \"%.0f\" }}% de RAM."
