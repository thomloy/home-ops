---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ups-graphite-rules
  namespace: monitoring
spec:
  groups:
    - name: ups.graphite.rules
      rules:

        # =========================
        # Batterie faible (< 20 %) + runtime < 20 min
        # =========================
        - alert: UPSOnBatteryLowRuntime
          expr: |
            truenas_nas_nut_ups_charge_charge <= 80
            and
            truenas_nas_nut_ups_runtime_runtime <= 1200
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "UPS sur batterie, autonomie critique"
            description: "Charge {{ $value }}% — moins de 20 minutes d'autonomie"

        # =========================
        # Batterie faible (< 20 %)
        # =========================
        - alert: UPSLowBatteryCharge
          expr: |
            truenas_nas_nut_ups_charge_charge <= 20
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "UPS batterie faible"
            description: "Batterie UPS à {{ $value }}%"

        # =========================
        # Tension d'entrée anormale (coupure secteur)
        # =========================
        - alert: UPSInputVoltageLow
          expr: |
            truenas_nas_nut_ups_input_voltage_voltage < 200
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "UPS tension secteur anormale"
            description: "Tension d'entrée à {{ $value }}V (normal ~230V)"

        # =========================
        # UPS non joignable
        # =========================
        - alert: UPSExporterDown
          expr: |
            absent(truenas_nas_nut_ups_charge_charge)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "UPS métriques manquantes"
            description: "Aucune métrique UPS reçue depuis 5 minutes"
