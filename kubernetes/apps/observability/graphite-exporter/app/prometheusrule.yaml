---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ups-graphite-rules
spec:
  groups:
    - name: ups.rules
      rules:

        # =========================
        # Sur batterie (coupure secteur)
        # =========================
        - alert: UPSOnBattery
          expr: |
            network_ups_tools_ups_status{flag="OB"} == 1
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "UPS sur batterie — coupure secteur"
            description: "L'UPS est passé sur batterie. Charge actuelle : {{ with query \"network_ups_tools_battery_charge\" }}{{ . | first | value }}%{{ end }}"

        # =========================
        # Batterie faible (< 20 %) + runtime < 20 min
        # =========================
        - alert: UPSOnBatteryLowRuntime
          expr: |
            network_ups_tools_battery_charge <= 20
            and
            network_ups_tools_battery_runtime <= 1200
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "UPS sur batterie, autonomie critique"
            description: "Charge {{ $value }}% — moins de 20 minutes d'autonomie"

        # =========================
        # Batterie faible (< 20 %)
        # =========================
        - alert: UPSLowBatteryCharge
          expr: |
            network_ups_tools_battery_charge <= 20
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "UPS batterie faible"
            description: "Batterie UPS à {{ $value }}%"

        # =========================
        # UPS non joignable
        # =========================
        - alert: UPSExporterDown
          expr: |
            absent(network_ups_tools_battery_charge)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "UPS métriques manquantes"
            description: "Aucune métrique NUT reçue depuis 5 minutes"
