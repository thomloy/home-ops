apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: graphite-exporter
  namespace: observability
spec:
  chartRef:
    kind: OCIRepository
    name: graphite-exporter
  interval: 1h
  values:
    replicaCount: 1
    image:
      repository: prom/graphite-exporter
      tag: v0.16.0@sha256:e54bca6645ea8a9e8c52312a8540de98ad08819d38476c021d77a0eae75bc797
    args:
      - "--graphite.listen-address=:2003"
      - "--web.listen-address=:9108"
---
apiVersion: v1
kind: Service
metadata:
  name: graphite-exporter
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: graphite-exporter
    app.kubernetes.io/instance: graphite-exporter
  ports:
    - name: graphite
      port: 2003
      targetPort: 2003
    - name: metrics
      port: 9108
      targetPort: 9108
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: graphite-exporter
  namespace: observability
spec:
  selector:
    matchLabels:
      app: graphite-exporter
  endpoints:
    - port: metrics
      interval: 30s
