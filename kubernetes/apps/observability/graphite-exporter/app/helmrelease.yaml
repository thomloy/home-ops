apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: graphite-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: graphite-exporter
  interval: 1h
  selector:
    matchLabels:
      app: graphite-exporter
  template:
    metadata:
      labels:
        app: graphite-exporter
    spec:
      chartRef:
        kind: OCIRepository
        name: graphite-exporter
      interval: 1h
      values:
        replicaCount: 1
        image:
          repository: prom/graphite-exporter
          tag: v0.15.0
        args:
          - "--graphite.listen-address=:2003"
          - "--web.listen-address=:9108"
---
apiVersion: v1
kind: Service
metadata:
  name: graphite-exporter
  namespace: observability
spec:
  selector:
    app: graphite-exporter
  ports:
    - name: graphite
      port: 2003
      targetPort: 2003
    - name: metrics
      port: 9108
      targetPort: 9108