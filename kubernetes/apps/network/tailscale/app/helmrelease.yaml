---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale
  interval: 1h
  values:
    controllers:
      tailscale:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          name: tailscale
        containers:
          app:
            image:
              repository: ghcr.io/tailscale/tailscale
              tag: v1.98.10
            env:
              TS_KUBE_SECRET: tailscale-state
              TS_USERSPACE: "true"
              TS_AUTH_ONCE: "true"
              TS_HOSTNAME: homelab
              TS_EXTRA_ARGS: "--advertise-exit-node"
              TS_SERVE_CONFIG: /etc/tsconfig/serve.json
            envFrom:
              - secretRef:
                  name: tailscale-oauth
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # tailscale persists its node state in the tailscale-state Secret via the
      # k8s API (TS_KUBE_SECRET + rbac.yaml). app-template v5 flips the SA token
      # automount default to false, which would break that — keep it mounted.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
    persistence:
      tsconfig:
        type: configMap
        name: tailscale-serve
        advancedMounts:
          tailscale:
            app:
              - path: /etc/tsconfig
                readOnly: true
