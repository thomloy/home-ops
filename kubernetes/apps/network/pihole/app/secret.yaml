---
apiVersion: v1
kind: Secret
metadata:
  name: pihole-secret
stringData:
  # Substituted from cluster-secrets (SOPS-decrypted by Flux). App-level
  # *.sops.yaml is NOT decrypted here — the per-app Kustomizations have no
  # decryption, only postBuild.substituteFrom cluster-secrets.
  FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
