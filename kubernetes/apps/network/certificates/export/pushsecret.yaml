apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kryzql-space-production-tls
  namespace: network
spec:
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: kryzql-space-production-tls
  template:
    type: kubernetes.io/tls
    data:
      tls.crt: '{{ index . "tls.crt" | b64dec }}'
      tls.key: '{{ index . "tls.key" | b64dec }}'
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: kryzql-space-production
          property: tls.crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: kryzql-space-production
          property: tls.key
