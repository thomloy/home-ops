---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${SECRET_DOMAIN_SLUG}"
spec:
  dnsNames:
    - ${SECRET_DOMAIN}
    - "*.${SECRET_DOMAIN}"
  # Let's Encrypt issues 90-day certs. duration must match (2160h) so
  # cert-manager schedules renewal correctly; with the old 160h it renewed
  # only ~53h before the real expiry (2-day buffer). renewBefore 30 days.
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: "${SECRET_DOMAIN_SLUG}-tls"
  usages:
    - digital signature
