---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${SECRET_DOMAIN_SLUG}"
spec:
  dnsNames:
    - ${SECRET_DOMAIN}
    - "*.${SECRET_DOMAIN}"
  # Short-lived certs: this issuer hands out ~7-day Let's Encrypt certs, so
  # duration: 160h is correct and the "~7 days remaining" the dashboard shows
  # is normal (cert-manager auto-renews every ~5 days). Do NOT raise duration
  # or set a large renewBefore — that would make cert-manager renew in a loop
  # and hit LE rate limits.
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: "${SECRET_DOMAIN_SLUG}-tls"
  usages:
    - digital signature
