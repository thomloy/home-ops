---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${SECRET_DOMAIN_SLUG}-tls
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${SECRET_DOMAIN_SLUG}-tls
    creationPolicy: Orphan
    template:
      type: kubernetes.io/tls
      metadata:
        annotations:
          cert-manager.io/alt-names: "*.${SECRET_DOMAIN},${SECRET_DOMAIN}"
          cert-manager.io/certificate-name: ${SECRET_DOMAIN_SLUG}
          cert-manager.io/common-name: ""
          cert-manager.io/ip-sans: ""
          cert-manager.io/issuer-group: ""
          cert-manager.io/issuer-kind: ClusterIssuer
          cert-manager.io/issuer-name: letsencrypt-production
          cert-manager.io/uri-sans: ""
        labels:
          controller.cert-manager.io/fao: "true"
  # Cert and key live in two 1Password items (see export/pushsecret.yaml).
  data:
    - secretKey: tls.crt
      remoteRef:
        key: ${SECRET_DOMAIN_SLUG}-tls-crt
        property: tls.crt
        decodingStrategy: None
    - secretKey: tls.key
      remoteRef:
        key: ${SECRET_DOMAIN_SLUG}-tls-key
        property: tls.key
        decodingStrategy: None