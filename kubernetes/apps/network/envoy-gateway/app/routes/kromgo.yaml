apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kromgo
  namespace: network
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - "kromgo.kryzql.space"
  rules:
    - backendRefs:
        - name: kromgo
          namespace: observability
          port: 8080
