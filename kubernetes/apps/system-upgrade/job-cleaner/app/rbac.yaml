---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-cleaner
  namespace: system-upgrade
---
# Least-privilege: only list/delete finished Jobs and their Pods, cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-cleaner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-cleaner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-cleaner
subjects:
  - kind: ServiceAccount
    name: job-cleaner
    namespace: system-upgrade
