---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nut-shutdown-script
data:
  monitor.sh: |
    #!/bin/sh
    THRESHOLD="${THRESHOLD:-20}"
    SHUTDOWN_DONE=0

    echo "[nut-shutdown] Starting — host=${NAS_IP}, threshold=$${THRESHOLD}%"

    nut_var() {
      printf "GET VAR ups %s\n" "$1" | nc -w 3 "${NAS_IP}" 3493 2>/dev/null | awk -F'"' '{print $2}'
    }

    while true; do
      BATT=$(nut_var "battery.charge")
      STATUS=$(nut_var "ups.status")

      if [ -z "$${BATT}" ] || [ -z "$${STATUS}" ]; then
        echo "[nut-shutdown] WARN: Cannot reach NUT server at ${NAS_IP}:3493"
        sleep 60
        continue
      fi

      echo "[nut-shutdown] status=$${STATUS} battery=$${BATT}%"

      if [ "$${SHUTDOWN_DONE}" = "0" ] && \
         echo "$${STATUS}" | grep -q "OB" && \
         [ "$${BATT}" -lt "$${THRESHOLD}" ]; then

        echo "[nut-shutdown] CRITICAL: $${BATT}% on battery — shutting down cluster NOW"
        SHUTDOWN_DONE=1

        /shared/talosctl --talosconfig /talos/talosconfig shutdown \
          -n 192.168.42.41 \
          -n 192.168.42.42 \
          -n 192.168.42.43 \
          --wait=false || true

        echo "[nut-shutdown] Shutdown signal sent — waiting for power off"
        sleep 300
        SHUTDOWN_DONE=0
      fi

      sleep 30
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-shutdown
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nut-shutdown
  template:
    metadata:
      labels:
        app: nut-shutdown
    spec:
      priorityClassName: system-cluster-critical
      containers:
        - name: nut-shutdown
          image: alpine:3.21
          command: ["/bin/sh", "/scripts/monitor.sh"]
          env:
            - name: NAS_IP
              value: "${NAS_IP}"
            - name: THRESHOLD
              value: "20"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: shared
              mountPath: /shared
            - name: talosconfig
              mountPath: /talos
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
        - name: nut-exporter
          image: ghcr.io/druggeri/nut_exporter:3.1.1@sha256:0d9a0a00554081876178369ab9d46717e002fcf550b18dcd85f98c315438b524
          env:
            - name: NUT_EXPORTER_SERVER
              value: "${NAS_IP}"
            - name: NUT_EXPORTER_VARIABLES
              value: "battery.charge,battery.runtime,ups.load,ups.status,output.voltage,ups.realpower"
          ports:
            - name: metrics
              containerPort: 9199
              protocol: TCP
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scripts
          configMap:
            name: nut-shutdown-script
            defaultMode: 0755
        - name: shared
          # image volume (K8s 1.31+): mounts the talosctl image filesystem directly.
          # The scratch image has only /talosctl at its root, so mounting at /shared
          # makes the binary available at /shared/talosctl without cp or shell utils.
          image:
            # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
            reference: ghcr.io/siderolabs/talosctl:v1.12.6
            pullPolicy: IfNotPresent
        - name: talosconfig
          secret:
            secretName: nut-shutdown-secret
            items:
              - key: talosconfig
                path: talosconfig
      restartPolicy: Always
