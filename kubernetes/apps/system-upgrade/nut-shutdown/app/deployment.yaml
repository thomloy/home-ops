---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nut-shutdown-script
data:
  monitor.sh: |
    #!/bin/sh
    THRESHOLD="${THRESHOLD:-20}"
    # Require this many consecutive OB+low-battery readings before triggering (30s poll → 3 = 90s minimum)
    CONSECUTIVE_REQUIRED="${CONSECUTIVE_REQUIRED:-3}"
    SHUTDOWN_DONE=0
    OB_COUNT=0

    echo "[nut-shutdown] Starting — host=${NAS_IP}, threshold=$${THRESHOLD}%, consecutive_required=$${CONSECUTIVE_REQUIRED}"

    nut_var() {
      printf "GET VAR ups %s\n" "$1" | nc -w 3 "${NAS_IP}" 3493 2>/dev/null | awk -F'"' '{print $2}'
    }

    # Send shutdown.return: UPS cuts power after ups.delay.shutdown, restarts when AC returns
    nut_shutdown_return() {
      printf "USERNAME %s\nPASSWORD %s\nINSTCMD ups shutdown.return\nLOGOUT\n" \
        "${NUT_USER}" "${NUT_PASS}" | nc -w 5 "${NAS_IP}" 3493 2>/dev/null
    }

    while true; do
      BATT=$(nut_var "battery.charge")
      STATUS=$(nut_var "ups.status")
      RUNTIME=$(nut_var "battery.runtime")

      if [ -z "$${BATT}" ] || [ -z "$${STATUS}" ]; then
        echo "[nut-shutdown] WARN: Cannot reach NUT server at ${NAS_IP}:3493 — resetting OB counter"
        OB_COUNT=0
        sleep 60
        continue
      fi

      echo "[nut-shutdown] status=$${STATUS} battery=$${BATT}% runtime=$${RUNTIME}s ob_count=$${OB_COUNT}/$${CONSECUTIVE_REQUIRED}"

      if echo "$${STATUS}" | grep -q "OB" && [ "$${BATT}" -lt "$${THRESHOLD}" ]; then
        OB_COUNT=$((OB_COUNT + 1))
        echo "[nut-shutdown] WARNING: On battery at $${BATT}% — count $${OB_COUNT}/$${CONSECUTIVE_REQUIRED}"
      else
        if [ "$${OB_COUNT}" -gt 0 ]; then
          echo "[nut-shutdown] INFO: Status normalized ($${STATUS} $${BATT}%) — resetting OB counter"
        fi
        OB_COUNT=0
      fi

      if [ "$${SHUTDOWN_DONE}" = "0" ] && [ "$${OB_COUNT}" -ge "$${CONSECUTIVE_REQUIRED}" ]; then
        echo "[nut-shutdown] CRITICAL: $${BATT}% on battery for $${CONSECUTIVE_REQUIRED} consecutive checks — shutting down cluster NOW"
        SHUTDOWN_DONE=1

        /shared/talosctl --talosconfig /talos/talosconfig shutdown \
          -n 192.168.42.41 \
          -n 192.168.42.42 \
          -n 192.168.42.43 \
          --wait=false || true

        echo "[nut-shutdown] Nodes shutdown sent — ordering UPS shutdown.return"
        sleep 20
        nut_shutdown_return && echo "[nut-shutdown] UPS shutdown.return accepted" || echo "[nut-shutdown] WARN: UPS shutdown.return failed"

        echo "[nut-shutdown] UPS will cut power in ~20s and restart automatically when AC returns"
        sleep 300
        SHUTDOWN_DONE=0
        OB_COUNT=0
      fi

      sleep 30
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut-shutdown
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nut-shutdown
  template:
    metadata:
      labels:
        app: nut-shutdown
    spec:
      priorityClassName: system-cluster-critical
      containers:
        - name: nut-shutdown
          image: alpine:3.21
          command: ["/bin/sh", "/scripts/monitor.sh"]
          env:
            - name: NAS_IP
              value: "${NAS_IP}"
            - name: THRESHOLD
              value: "20"
            - name: CONSECUTIVE_REQUIRED
              value: "3"
            - name: NUT_USER
              valueFrom:
                secretKeyRef:
                  name: nut-shutdown-secret
                  key: nut-user
            - name: NUT_PASS
              valueFrom:
                secretKeyRef:
                  name: nut-shutdown-secret
                  key: nut-pass
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: shared
              mountPath: /shared
            - name: talosconfig
              mountPath: /talos
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
        - name: nut-exporter
          image: ghcr.io/druggeri/nut_exporter:3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
          env:
            - name: NUT_EXPORTER_SERVER
              value: "${NAS_IP}"
            - name: NUT_EXPORTER_VARIABLES
              value: "battery.charge,battery.runtime,ups.load,ups.status,output.voltage,ups.realpower"
          ports:
            - name: metrics
              containerPort: 9199
              protocol: TCP
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scripts
          configMap:
            name: nut-shutdown-script
            defaultMode: 0755
        - name: shared
          # image volume (K8s 1.31+): mounts the talosctl image filesystem directly.
          # The scratch image has only /talosctl at its root, so mounting at /shared
          # makes the binary available at /shared/talosctl without cp or shell utils.
          image:
            # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
            reference: ghcr.io/siderolabs/talosctl:v1.13.3
            pullPolicy: IfNotPresent
        - name: talosconfig
          secret:
            secretName: nut-shutdown-secret
            items:
              - key: talosconfig
                path: talosconfig
      restartPolicy: Always
