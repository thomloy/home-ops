---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-ops-runner
---
# Minimal ClusterRole: read-only access to CRDs (needed by schemas workflow)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: home-ops-runner
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: home-ops-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: home-ops-runner
subjects:
  - kind: ServiceAccount
    name: home-ops-runner
    namespace: actions-runner