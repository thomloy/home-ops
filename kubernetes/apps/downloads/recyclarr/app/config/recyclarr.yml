---
# yaml-language-server: https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
sonarr:
  sonarr:
    base_url: http://sonarr.downloads.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    include:
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p
      - template: sonarr-v4-quality-profile-web-2160p
      - template: sonarr-v4-custom-formats-web-2160p
      - template: sonarr-v4-quality-profile-bluray-web-1080p-french-multi-vo
      - template: sonarr-v4-custom-formats-bluray-web-1080p-french-multi-vo
    quality_profiles:
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
      - name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
      - name: FR-MULTi-VO-WEB-1080p
        reset_unmatched_scores:
          enabled: true
    custom_formats:
      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca # DV (WEBDL)
        assign_scores_to:
          - name: WEB-2160p
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
        assign_scores_to:
          - name: WEB-1080p
          - name: WEB-2160p

radarr:
  radarr:
    base_url: http://radarr.downloads.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    include:
      - template: radarr-quality-profile-sqp-1-2160p-default
      - template: radarr-custom-formats-sqp-1-2160p
      - template: radarr-quality-profile-hd-bluray-web-french-multi-vo
      - template: radarr-custom-formats-hd-bluray-web-french-multi-vo
    quality_profiles:
      - name: SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true
      - name: FR-MULTi-VO-HD
        reset_unmatched_scores:
          enabled: true
    custom_formats:
      - trash_ids:
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - name: SQP-1 (2160p)

lidarr:
  lidarr:
    base_url: http://lidarr.downloads.svc.cluster.local:8686
    api_key: !env_var LIDARR_API_KEY
    quality_definition:
      type: music
