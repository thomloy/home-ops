---
# yaml-language-server: https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lidarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: lidarr
  components:
    - ../../../../components/nfs-scaler
    - ../../../../components/volsync
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system

  interval: 1h
  path: ./kubernetes/apps/downloads/lidarr/app
  postBuild:
    substitute:
      APP: lidarr
      VOLSYNC_CLAIM: lidarr-config
      VOLSYNC_SCHEDULE: "30 4 * * *"
      VOLSYNC_CAPACITY: 2Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
  timeout: 5m
  wait: false
