---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kavita
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kavita
  components:
    - ../../../../components/volsync
    - ../../../../components/nfs-scaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system

  interval: 1h
  path: "./kubernetes/apps/media/kavita/app"
  postBuild:
    substitute:
      APP: kavita
      VOLSYNC_CLAIM: kavita
      VOLSYNC_SCHEDULE: "45 3 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false
