---
# yaml-language-server: https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: navidrome
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: navidrome
  components:
    - ../../../../components/volsync
    - ../../../../components/nfs-scaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system

  interval: 1h
  path: "./kubernetes/apps/media/navidrome/app"
  patches:
    # Keep navidrome always reachable. The nfs-scaler component scales it to 0
    # when the NAS NFS probe (192.168.42.44:2049) goes inactive, which makes the
    # gateway return HTTP 503 to clients (Feishin "network error"). Pin
    # minReplicaCount to 1 so the app stays up. This touches ONLY navidrome's
    # KEDA ScaledObject — no networking / gateway changes.
    - patch: |
        apiVersion: keda.sh/v1alpha1
        kind: ScaledObject
        metadata:
          name: navidrome
        spec:
          minReplicaCount: 1
      target:
        kind: ScaledObject
        name: navidrome
  postBuild:
    substitute:
      APP: navidrome
      VOLSYNC_CLAIM: navidrome
      VOLSYNC_SCHEDULE: "30 3 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false
