---
# yaml-language-server: https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: navidrome
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: navidrome
  components:
    - ../../../../components/volsync
    - ../../../../components/nfs-scaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system

  interval: 1h
  path: "./kubernetes/apps/media/navidrome/app"
  postBuild:
    substitute:
      APP: navidrome
      # Keep navidrome always reachable. The nfs-scaler scales it to 0 when the
      # NAS NFS probe (192.168.42.44:2049) is inactive, which makes the gateway
      # return HTTP 503 to clients (Feishin "network error"). Pin the scaler's
      # floor to 1 so it stays up. Touches ONLY navidrome's KEDA scaler — no
      # networking / gateway changes.
      MIN_REPLICAS: "1"
      VOLSYNC_CLAIM: navidrome
      VOLSYNC_SCHEDULE: "30 3 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false
