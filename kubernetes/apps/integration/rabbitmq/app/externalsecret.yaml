---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rabbitmq-secret
    creationPolicy: Owner
    template:
      data:
        RABBITMQ_USER: "{{ .RABBITMQ_USER }}"
        RABBITMQ_PASSWORD: "{{ .RABBITMQ_PASSWORD }}"
        # Full broker config lives in the secret because it carries the admin credentials.
        rabbitmq.conf: |
          default_user = {{ .RABBITMQ_USER }}
          default_pass = {{ .RABBITMQ_PASSWORD }}
          default_user_tags.administrator = true
          default_permissions.configure = .*
          default_permissions.read = .*
          default_permissions.write = .*
          log.console = true
          log.console.level = info
          log.file = false
          # One metric per queue (needed for per-flow dashboards and alerts)
          prometheus.return_per_object_metrics = true
          vm_memory_high_watermark.relative = 0.6
          disk_free_limit.absolute = 500MB
  dataFrom:
    - extract:
        key: rabbitmq
