---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: contrats-flow
  annotations:
    # The dashboard JSON carries Grafana variables, keep Flux from substituting them
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "title": "Flux contrats",
      "uid": "contrats-flow",
      "tags": [
        "integration",
        "rabbitmq"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "editable": true,
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Taux de rejet",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "sum(rate(contrats_rejetes_total{namespace=\"integration\"}[$__rate_interval])) / (sum(rate(contrats_valides_total{namespace=\"integration\"}[$__rate_interval])) + sum(rate(contrats_rejetes_total{namespace=\"integration\"}[$__rate_interval])))",
              "legendFormat": "rejet"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.1
                  },
                  {
                    "color": "red",
                    "value": 0.15
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {},
          "description": "Part des contrats rejetés par les règles de contrôle"
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Contrats émis / min",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "sum(rate(contrats_emis_total{namespace=\"integration\"}[$__rate_interval])) * 60"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Contrats intégrés / min",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "sum(rate(contrats_integres_total{namespace=\"integration\"}[$__rate_interval])) * 60"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Messages illisibles (1 h)",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "sum(increase(contrats_illisibles_total{namespace=\"integration\"}[1h]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Rejets par règle de contrôle",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "sum by (regle) (rate(contrats_rejetes_total{namespace=\"integration\"}[$__rate_interval])) * 60",
              "legendFormat": "{{regle}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 30
              }
            },
            "overrides": []
          },
          "options": {},
          "description": "Contrats rejetés par minute, par règle"
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Taux de rejet par source",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "sum by (source) (rate(contrats_rejetes_total{namespace=\"integration\"}[$__rate_interval])) / (sum by (source) (rate(contrats_valides_total{namespace=\"integration\"}[$__rate_interval])) + sum by (source) (rate(contrats_rejetes_total{namespace=\"integration\"}[$__rate_interval])))",
              "legendFormat": "{{source}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {},
          "description": "Qualité des données par système émetteur (outils garages, portail filiales, batch)"
        },
        {
          "id": 7,
          "type": "bargauge",
          "title": "Rejets par pays (1 h)",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "sort_desc(sum by (pays) (increase(contrats_rejetes_total{namespace=\"integration\"}[1h])))",
              "legendFormat": "{{pays}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Messages en attente par file",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 8,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "rabbitmq_queue_messages_ready{namespace=\"integration\", queue=~\"contrats.*\"}",
              "legendFormat": "{{queue}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {},
          "description": "Profondeur des files RabbitMQ (retard de traitement)"
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Consommateurs par file",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 16,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "rabbitmq_queue_consumers{namespace=\"integration\", queue=~\"contrats.*\"}",
              "legendFormat": "{{queue}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {},
          "description": "0 consommateur = flux bloqué"
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Temps de contrôle (p95)",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(contrats_controle_secondes_bucket{namespace=\"integration\"}[$__rate_interval])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
