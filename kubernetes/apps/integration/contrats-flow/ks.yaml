---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: contrats-flow
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: contrats-flow
  dependsOn:
    - name: rabbitmq
      namespace: integration
  interval: 1h
  path: ./kubernetes/apps/integration/contrats-flow/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: integration
  timeout: 5m
  wait: false
