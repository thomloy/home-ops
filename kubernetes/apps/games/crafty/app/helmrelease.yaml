---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crafty
spec:
  chartRef:
    kind: OCIRepository
    name: crafty
  interval: 1h
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      crafty:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          volumeClaimTemplates: []
        pod:
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              # renovate: datasource=docker depName=registry.gitlab.com/crafty-controller/crafty-4
              repository: registry.gitlab.com/crafty-controller/crafty-4
              tag: "4.4.7"
            env:
              TZ: Europe/Paris
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8443
                  failureThreshold: 30
                  periodSeconds: 10
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8443
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: false
          proxy:
            image:
              # renovate: datasource=docker depName=nginx
              repository: nginx
              tag: 1.27-alpine
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true

    service:
      app:
        controller: crafty
        primary: true
        ports:
          http:
            port: 8000
            targetPort: 8000
      minecraft:
        controller: crafty
        ports:
          mc:
            port: 25565
            protocol: TCP
            targetPort: 25565

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            alerts:
              - type: pushover
            conditions: ["[STATUS] < 500"]
            ui:
              hide-hostname: true
        hostnames:
          - crafty.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        storageClass: ceph-block
        advancedMounts:
          crafty:
            app:
              - path: /crafty/servers
                subPath: servers
              - path: /crafty/backups
                subPath: backups
              - path: /crafty/import
                subPath: import
              - path: /crafty/logs
                subPath: logs
              - path: /crafty/app/config
                subPath: app-config
      nginx-config:
        type: configMap
        name: crafty-nginx
        advancedMounts:
          crafty:
            proxy:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf
                readOnly: true
      nginx-tmp:
        type: emptyDir
        advancedMounts:
          crafty:
            proxy:
              - path: /tmp
                subPath: tmp
              - path: /var/cache/nginx
                subPath: cache
              - path: /var/log/nginx
                subPath: log
