---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: romm-postgres
spec:
  schedule: "0 0 3 * * 0"
  backupOwnerReference: self
  cluster:
    name: romm-postgres
  method: volumeSnapshot
