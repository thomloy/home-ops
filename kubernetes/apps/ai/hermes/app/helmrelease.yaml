---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          gateway:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: "v2026.5.29.2"
            command:
              - gateway
              - run
            envFrom:
              - secretRef:
                  name: hermes-secret
            env:
              HERMES_UID: "10000"
              HERMES_GID: "10000"
              HERMES_HOME: /opt/data
              TZ: Europe/Paris
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 1536Mi
          dashboard:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: "v2026.5.29.2"
            command:
              - dashboard
              - --host
              - 0.0.0.0
              - --no-open
              - --insecure
            envFrom:
              - secretRef:
                  name: hermes-secret
            env:
              HERMES_UID: "10000"
              HERMES_GID: "10000"
              HERMES_HOME: /opt/data
              TZ: Europe/Paris
            probes:
              liveness: &dashboardProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9119
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *dashboardProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9119
                  failureThreshold: 60
                  periodSeconds: 5
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: hermes
        ports:
          http:
            port: 9119

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            alerts:
              - type: pushover
            conditions: ["[STATUS] < 500"]
            ui:
              hide-hostname: true
        hostnames:
          - hermes.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: hermes
                port: 9119

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        advancedMounts:
          hermes:
            gateway:
              - path: /opt/data
            dashboard:
              - path: /opt/data

    disableDefaultSecurityContext: All
