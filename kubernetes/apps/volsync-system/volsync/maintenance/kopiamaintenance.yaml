---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/volsync.backube/kopiamaintenance_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: daily
spec:
  enabled: true
  trigger:
    schedule: 30 3,15 * * *
  moverVolumes:
    - mountPath: repository
      volumeSource:
        nfs:
          path: /mnt/HDD1X4/VolsyncKopia
          server: ${NAS_IP}
  repository:
    repository: volsync-maintenance-secret