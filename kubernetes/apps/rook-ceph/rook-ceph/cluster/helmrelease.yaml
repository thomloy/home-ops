---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  postRenderers:
    # The built-in CephPoolGrowthWarning rule does
    #   predict_linear(ceph_pool_percent_used[2d], ...) * on(...) group_right() ceph_pool_metadata
    # When a mgr pod is recreated (upgrade/failover), the [2d] range window holds
    # series from BOTH the old and new pod for the same {cluster,pool_id,instance},
    # so group_right() hits "many-to-many matching not allowed" → Prometheus fires
    # PrometheusRuleFailures (critical) for ~2 days each time. Wrapping the LHS in
    # max by(cluster,pool_id,instance)(...) collapses the duplicate to one series
    # per match group — restart-proof, identical alerting semantics. The `test` op
    # guards the index: if a chart upgrade reorders the rules, the build fails
    # loudly in CI instead of silently patching the wrong rule.
    - kustomize:
        patches:
          - target:
              kind: PrometheusRule
              name: prometheus-ceph-rules
            patch: |
              - op: test
                path: /spec/groups/7/rules/0/alert
                value: CephPoolGrowthWarning
              - op: replace
                path: /spec/groups/7/rules/0/expr
                value: "(max by(cluster, pool_id, instance) (predict_linear(ceph_pool_percent_used[2d], 3600 * 24 * 5)) * on(cluster, pool_id, instance) group_right() ceph_pool_metadata) >= 95"
  values:
    # Pin the Ceph image via the chart's documented top-level value. Do NOT put
    # a cephVersion block inside cephClusterSpec — the chart renders cephVersion
    # there too, producing a duplicate-key error. The on-disk mon/osd store is
    # v20 (Tentacle) and cannot be downgraded, so never let the version float.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.3
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        annotations:
          gatus.home-operations.com/endpoint: |-
            alerts:
              - type: pushover
            conditions: ["[STATUS] < 500"]
            ui:
              hide-hostname: true
        host:
          name: rook.${SECRET_DOMAIN}
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
          ms_bind_ipv4: "true"
          ms_bind_ipv6: "false"
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        addressRanges:
          cluster:
            - 169.254.255.0/24 # mesh TB 4.0 (réplication inter-OSD)
        connections:
          requireMsgr2: true
      resources:
        osd:
          limits:
            memory: 8Gi
        mgr:
          # Default 1Gi limit but the mgr peaked at 973Mi (95%) — modules
          # (prometheus, diskprediction, pg_autoscaler) grow with cluster
          # activity, so an OOM here is a real risk and degrades cluster mgmt.
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
      storage:
        useAllNodes: true
        useAllDevices: false
        devicePathFilter: "^/dev/disk/by-id/nvme-BIWIN_NV7200_1TB_.*$"
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems: []
    cephObjectStores: []