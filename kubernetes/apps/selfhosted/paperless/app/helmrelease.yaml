---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: paperless

  values:

    controllers:
      paperless:
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 2.20.10

            env:

              PAPERLESS_URL: https://paperless.kryzql.space
              PAPERLESS_TIME_ZONE: Europe/Paris

              PAPERLESS_REDIS: redis://paperless-redis:6379

              PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
              PAPERLESS_DATA_DIR: /usr/src/paperless/data
              PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
              PAPERLESS_EXPORT_DIR: /usr/src/paperless/export

              PAPERLESS_OCR_LANGUAGES: nld
              PAPERLESS_OCR_LANGUAGE: nld

              PAPERLESS_ADMIN_USER:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secret
                    key: PAPERLESS_ADMIN_USER

              PAPERLESS_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secret
                    key: PAPERLESS_ADMIN_PASSWORD

              PAPERLESS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secret
                    key: PAPERLESS_SECRET_KEY

            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi

      redis:
        containers:
          redis:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.0.3

    service:
      paperless:
        controller: paperless
        ports:
          http:
            port: 8000

      redis:
        controller: redis
        ports:
          redis:
            port: 6379

    persistence:
      data:
        existingClaim: volsync-paperless-dst-dest
        globalMounts:
          - path: /usr/src/paperless/data
          - path: /usr/src/paperless/media

      consume:
        type: nfs
        server: 192.168.42.44
        path: /mnt/HDD1X4/apps/paperless/incoming
        globalMounts:
          - path: /usr/src/paperless/consume

    route:
      app:
        hostnames:
          - paperless.kryzql.space
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: paperless
                port: http