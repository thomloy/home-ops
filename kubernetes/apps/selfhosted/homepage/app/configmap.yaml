---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: zinc
    headerStyle: underlined
    target: _blank
    layout:
      # Home tab - 2 columns
      Monitoring:
        tab: Home
        style: column
        icon: mdi-chart-line
      System:
        tab: Home
        style: column
        icon: mdi-server-network

      # Media tab - 2 columns
      Video:
        tab: Media
        style: column
        icon: mdi-television-play
      Audio:
        tab: Media
        style: column
        icon: mdi-headphones

      # Downloads tab - 3 columns
      Movies & Series:
        tab: Downloads
        style: column
        icon: mdi-movie-open
      Downloaders:
        tab: Downloads
        style: column
        icon: mdi-download
      Indexers:
        tab: Downloads
        style: column
        icon: mdi-magnify

      # Tools tab - 3 columns
      Documents:
        tab: Tools
        style: column
        icon: mdi-file-document
      Kitchen:
        tab: Tools
        style: column
        icon: mdi-chef-hat
      Dev:
        tab: Tools
        style: column
        icon: mdi-code-braces

  widgets.yaml: |
    - datetime:
        text_size: l
        format:
          timeStyle: short
          dateStyle: long
          hourCycle: h23
          locale: fr-FR
    - search:
        provider: google
        target: _blank
        focus: false

  bookmarks.yaml: |
    - Quick Links:
        - home-ops:
            - href: https://github.com/thomloy/home-ops
              icon: github.svg
              description: GitOps repo
        - Grafana:
            - href: https://grafana.kryzql.space
              icon: grafana.svg
              description: Monitoring

  services.yaml: |
    # ── Home ──────────────────────────────────────────────
    - Monitoring:
        - Grafana:
            href: https://grafana.kryzql.space
            description: Dashboards
            icon: grafana.svg
            siteMonitor: http://grafana-service.observability.svc.cluster.local:3000
        - Gatus:
            href: https://status.kryzql.space
            description: Status page
            icon: gatus.svg
        - Prometheus:
            href: https://grafana.kryzql.space
            description: Metrics
            icon: prometheus.svg
            siteMonitor: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090

    - System:
        - TrueNAS:
            href: http://NAS.internal
            description: NAS
            icon: truenas-scale.svg
            siteMonitor: http://NAS.internal
        - Flux:
            href: https://github.com/thomloy/home-ops
            description: GitOps
            icon: flux-cd.svg
            siteMonitor: http://source-controller.flux-system.svc.cluster.local:9090

    # ── Media ─────────────────────────────────────────────
    - Video:
        - Emby:
            href: https://emby.kryzql.space
            description: Media server
            icon: emby.svg
            siteMonitor: http://emby.media.svc.cluster.local:8096

    - Audio:
        - Audiobookshelf:
            href: https://audiobookshelf.kryzql.space
            description: Audiobooks & podcasts
            icon: audiobookshelf.svg
            siteMonitor: http://audiobookshelf.media.svc.cluster.local:80

    # ── Downloads ─────────────────────────────────────────
    - Movies & Series:
        - Radarr:
            href: https://radarr.kryzql.space
            description: Movies
            icon: radarr.svg
            widget:
              type: radarr
              url: http://radarr.downloads.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
              enableQueue: true
        - Sonarr:
            href: https://sonarr.kryzql.space
            description: Series
            icon: sonarr.svg
            widget:
              type: sonarr
              url: http://sonarr.downloads.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
              enableQueue: true
        - Bazarr:
            href: https://bazarr.kryzql.space
            description: Subtitles
            icon: bazarr.svg
            siteMonitor: http://bazarr.downloads.svc.cluster.local:80

    - Downloaders:
        - Sabnzbd:
            href: https://sabnzbd.kryzql.space
            description: Usenet
            icon: sabnzbd.svg
            widget:
              type: sabnzbd
              url: http://sabnzbd.downloads.svc.cluster.local:80
              key: "{{HOMEPAGE_VAR_SABNZBD_API_KEY}}"
        - qBittorrent:
            href: https://qbittorrent.kryzql.space
            description: Torrents
            icon: qbittorrent.svg
            siteMonitor: http://qbittorrent.downloads.svc.cluster.local:8080

    - Indexers:
        - Prowlarr:
            href: https://prowlarr.kryzql.space
            description: Indexer manager
            icon: prowlarr.svg
            widget:
              type: prowlarr
              url: http://prowlarr.downloads.svc.cluster.local:80
              key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"

    # ── Tools ─────────────────────────────────────────────
    - Documents:
        - Paperless:
            href: https://paperless.kryzql.space
            description: Document management
            icon: paperless-ngx.svg
            siteMonitor: http://paperless.selfhosted.svc.cluster.local:8000

    - Kitchen:
        - Mealie:
            href: https://mealie.kryzql.space
            description: Recipes
            icon: mealie.svg
            siteMonitor: http://mealie.default.svc.cluster.local:9000

    - Dev:
        - IT-Tools:
            href: https://it-tools.kryzql.space
            description: Dev tools
            icon: it-tools.svg
            siteMonitor: http://it-tools.selfhosted.svc.cluster.local:8080
