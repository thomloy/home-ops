---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    title: Home
    favicon: https://avatars.githubusercontent.com/u/108814145
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Media:
        style: row
        columns: 4
      Downloads:
        style: row
        columns: 4
      Selfhosted:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4

  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Homelab
    - datetime:
        text_size: l
        format:
          timeStyle: short
          dateStyle: short
          hourCycle: h23
    - search:
        provider: google
        target: _blank

  bookmarks.yaml: |
    - Links:
        - GitHub:
            - href: https://github.com/thomloy/home-ops
              icon: github.svg
        - Grafana:
            - href: https://grafana.kryzql.space
              icon: grafana.svg

  services.yaml: |
    - Media:
        - Emby:
            href: https://emby.kryzql.space
            description: Media server
            icon: emby.svg
            siteMonitor: http://emby.media.svc.cluster.local:8096
        - Audiobookshelf:
            href: https://audiobookshelf.kryzql.space
            description: Audiobooks
            icon: audiobookshelf.svg
            siteMonitor: http://audiobookshelf.media.svc.cluster.local:80

    - Downloads:
        - Radarr:
            href: https://radarr.kryzql.space
            description: Movies
            icon: radarr.svg
            widget:
              type: radarr
              url: http://radarr.downloads.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
        - Sonarr:
            href: https://sonarr.kryzql.space
            description: Series
            icon: sonarr.svg
            widget:
              type: sonarr
              url: http://sonarr.downloads.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
        - Prowlarr:
            href: https://prowlarr.kryzql.space
            description: Indexers
            icon: prowlarr.svg
            widget:
              type: prowlarr
              url: http://prowlarr.downloads.svc.cluster.local:80
              key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
        - Sabnzbd:
            href: https://sabnzbd.kryzql.space
            description: Usenet downloader
            icon: sabnzbd.svg
            widget:
              type: sabnzbd
              url: http://sabnzbd.downloads.svc.cluster.local:80
              key: "{{HOMEPAGE_VAR_SABNZBD_API_KEY}}"
        - qBittorrent:
            href: https://qbittorrent.kryzql.space
            description: Torrent downloader
            icon: qbittorrent.svg
            siteMonitor: http://qbittorrent.downloads.svc.cluster.local:8080
        - Bazarr:
            href: https://bazarr.kryzql.space
            description: Subtitles
            icon: bazarr.svg
            siteMonitor: http://bazarr.downloads.svc.cluster.local:80

    - Selfhosted:
        - Paperless:
            href: https://paperless.kryzql.space
            description: Document management
            icon: paperless-ngx.svg
            siteMonitor: http://paperless.selfhosted.svc.cluster.local:8000
        - Mealie:
            href: https://mealie.kryzql.space
            description: Recipes
            icon: mealie.svg
            siteMonitor: http://mealie.default.svc.cluster.local:9000
        - IT-Tools:
            href: https://it-tools.kryzql.space
            description: Dev tools
            icon: it-tools.svg
            siteMonitor: http://it-tools.selfhosted.svc.cluster.local:8080

    - Infrastructure:
        - Grafana:
            href: https://grafana.kryzql.space
            description: Monitoring
            icon: grafana.svg
            siteMonitor: http://grafana-service.observability.svc.cluster.local:3000
        - Gatus:
            href: https://status.kryzql.space
            description: Status page
            icon: gatus.svg
            siteMonitor: http://gatus.observability.svc.cluster.local:80
        - TrueNAS:
            href: http://192.168.42.44
            description: NAS
            icon: truenas-scale.svg
            siteMonitor: http://192.168.42.44
        - Flux:
            href: https://grafana.kryzql.space
            description: GitOps
            icon: flux-cd.svg
            widget:
              type: flux
              url: http://source-controller.flux-system.svc.cluster.local:9090
