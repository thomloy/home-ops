---
# yaml-language-server: $schema=https://kubernetes-schemas-ebx.pages.dev/external-secrets.io/externalsecret_v1.json
# FIXME: `key` below uses a 1Password item UUID instead of the title because
# a duplicate empty `sparkyfitness` item exists in the kubernetes vault
# (UUID whlia3luj7margu5iojuoyybfm) and blocks title-based lookup. Delete
# that item from 1Password, then revert all four `key:` lines to: sparkyfitness
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sparkyfitness-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: wviio3h3acyzcaaml464pn2ugm
        property: POSTGRES_PASSWORD
    - secretKey: APP_DB_PASSWORD
      remoteRef:
        key: wviio3h3acyzcaaml464pn2ugm
        property: APP_DB_PASSWORD
    - secretKey: API_ENCRYPTION_KEY
      remoteRef:
        key: wviio3h3acyzcaaml464pn2ugm
        property: API_ENCRYPTION_KEY
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: wviio3h3acyzcaaml464pn2ugm
        property: BETTER_AUTH_SECRET
