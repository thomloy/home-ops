---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./ciliumnetworkpolicy.yaml
configMapGenerator:
  - name: bentopdf-pwa
    files:
      - resources/site.webmanifest
      - resources/open.html
      - resources/open-file.js
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
