<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>BentoPDF</title>
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <style>
      html, body { margin: 0; height: 100%; background: #111827; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <!-- src is set by open-file.js so the load listener is attached first -->
    <iframe id="app" title="BentoPDF"></iframe>
    <!-- Bump ?v= when open-file.js changes: nginx and the service worker cache .js for a long time -->
    <script src="/open-file.js?v=1"></script>
  </body>
</html>
