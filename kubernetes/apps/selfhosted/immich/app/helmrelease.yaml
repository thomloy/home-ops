---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    server:
      enabled: true
      controllers:
        main:
          initContainers:
            wait-for-dns:
              image:
                repository: busybox
                tag: latest
              command:
                - /bin/sh
                - -c
                - until nslookup immich-postgres-rw.selfhosted.svc.cluster.local; do echo "waiting for DNS..."; sleep 2; done
          containers:
            main:
              env:
                DB_URL:
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-app
                      key: uri
      route:
        app:
          annotations:
            gatus.home-operations.com/endpoint: |-
              alerts:
                - type: pushover
              ui:
                hide-hostname: true
          hostnames:
            - immich.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network

    machine-learning:
      enabled: true

    valkey:
      enabled: true
