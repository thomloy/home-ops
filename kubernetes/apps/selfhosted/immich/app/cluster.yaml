---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    storageClass: ceph-block
    # 20Gi (was 5Gi): the combined data+WAL volume filled during the 2026-06
    # Ceph outage when WAL archiving stalled, and CNPG halts ("Not enough disk
    # space") until the PVC is enlarged. Headroom to ride out future archiving
    # outages without wedging the primary.
    size: 20Gi
  postgresql:
    parameters:
      # Plafonne le WAL qu'un slot de réplication peut retenir. Par défaut
      # max_slot_wal_keep_size = -1 (illimité) : une réplique morte garde son
      # slot déclaré mais inactif, et PostgreSQL conserve indéfiniment le WAL
      # dont elle aurait besoin — jusqu'à saturer le volume et faire tomber TOUT
      # le cluster, primary compris (c'est ce qui a tué nextcloud-postgres le
      # 2026-07-20, et l'incident de 2026-06 ci-dessus). Au-delà du plafond, le
      # slot est invalidé : la réplique en retard doit être re-clonée, mais le
      # cluster survit. 4GB = ~4x le régime normal (max_wal_size 1GB).
      max_slot_wal_keep_size: 4GB
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    # 2Gi (was 512Mi): the immich v2.6.3 -> v3.0.0 upgrade (chart 0.13.1) ran the
    # v3 schema migration + geodata re-import, whose working set blew past the
    # 512Mi limit and OOM-killed the primary in a loop. That stalled the Helm
    # upgrade (Deployment never went Ready) and wedged it into a failed rollback.
    # 2Gi gives headroom for the upgrade spike per the ">= 2x peak" rule.
    limits:
      memory: 2Gi
  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
        - CREATE EXTENSION IF NOT EXISTS vector;
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgres-store
        serverName: immich-postgres
  # PodMonitor managed explicitly in podmonitor.yaml (enablePodMonitor is
  # deprecated in CNPG 1.29 and will be removed)
