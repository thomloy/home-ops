                  {{$world := .JSON.String "data.world_size"}}
                  <div style="display:flex;flex-direction:column;gap:6px;font-size:.85em">
                    <div style="display:flex;justify-content:space-between;padding:5px 10px;background:rgba(0,0,0,.06);border-radius:5px">
                      <span style="opacity:.65">Statut</span>
                      <span style="font-weight:600;color:{{if $running}}#22c55e{{else}}#ef4444{{end}}">{{if $running}}● En ligne{{else}}○ Hors ligne{{end}}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:5px 10px;background:rgba(0,0,0,.06);border-radius:5px">
                      <span style="opacity:.65">Version</span>
                      <span style="font-family:monospace;font-size:.85em">{{if and $running (ne $version "False")}}{{$version}}{{else}}—{{end}}</span>
                    </div>
                    {{if $running}}
                    <div style="display:flex;justify-content:space-between;padding:5px 10px;background:rgba(0,0,0,.06);border-radius:5px">
                      <span style="opacity:.65">CPU / RAM</span>
                      <span>{{$cpu}}% / {{$mem}}%</span>
                    </div>
                    {{end}}
                    <div style="display:flex;justify-content:space-between;padding:5px 10px;background:rgba(0,0,0,.06);border-radius:5px">
                      <span style="opacity:.65">Taille monde</span>
                      <span>{{$world}}</span>
                    </div>
                    {{if and $running (ne $desc "False")}}
                    <div style="padding:5px 10px;background:rgba(0,0,0,.06);border-radius:5px">
                      <div style="opacity:.65;font-size:.85em;margin-bottom:3px">MOTD</div>
                      <div style="font-size:.85em">{{$desc}}</div>
                    </div>
                    {{end}}
                  </div>

          - size: small
            widgets:
              - type: bookmarks
                title: Liens
                groups:
                  - title: Administration
                    links:
                      - title: Crafty Controller
                        url: https://crafty.${SECRET_DOMAIN}
                        icon: si:minecraft
                  - title: Plugins & mods
                    links:
                      - title: Modrinth
                        url: https://modrinth.com
                        icon: si:modrinth
                      - title: SpigotMC Resources
                        url: https://www.spigotmc.org/resources/
                      - title: PaperMC Hangar
                        url: https://hangar.papermc.io
                        icon: si:papermc
                      - title: CurseForge
                        url: https://www.curseforge.com/minecraft
                        icon: si:curseforge
                  - title: Docs
                    links:
                      - title: PaperMC Docs
                        url: https://docs.papermc.io
                        icon: si:papermc
                      - title: Crafty Docs
                        url: https://docs.craftycontrol.com

              - type: releases
                title: Releases à suivre
                cache: 6h
                token: $${GITHUB_TOKEN}
                repositories:
                  - ViaVersion/ViaVersion
                  - ViaVersion/ViaBackwards
                  - BlueMap-Minecraft/BlueMap
                  - rommapp/romm

  custom.css: |
    body {
      background-image: url('/assets/bg.jpg') !important;
      background-size: cover !important;
      background-attachment: fixed !important;
      background-position: center !important;
      background-color: hsl(28, 15%, 18%) !important;
    }
    :root {
      --color-widget-background: hsla(28, 18%, 14%, 0.82) !important;
    }
    .widget-type-group [role="tablist"] .widget-group-title {
      background: rgba(255,255,255,.06);
      border-radius: 5px;
      padding: 2px 8px;
    }
    .widget-type-group [role="tablist"] .widget-group-title-current {
      background: rgba(255,255,255,.14);
    }
    /* Hide group tab headers in side columns — only center (full) tabs visible */
    .page-column-small .widget-type-group [role="tablist"] {
      display: none !important;
    }
    /* Animation trigger for JS init via onanimationstart attribute */
    @keyframes gls-init { from { opacity: 1; } to { opacity: 1; } }
    .gls-trigger { animation: gls-init 1ms; }
    /* Section headers inside group tab templates */
    .gls-section-hdr {
      font-size: .62em;
      font-weight: 700;
      letter-spacing: .09em;
      color: #f0d9a0;
      margin-bottom: 8px;
      margin-top: 2px;
      text-transform: uppercase;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    /* Separator between sections */
    .gls-sep {
      border-top: 1px solid rgba(0,0,0,.1);
      margin: 12px 0;
    }
    /* Queue / calendar items */
    .gls-item {
      padding: 6px 8px;
      background: rgba(0,0,0,.06);
      border-radius: 5px;
    }
    .gls-item-title {
      font-size: .8em;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gls-item-sub {
      display: flex;
      justify-content: space-between;
      font-size: .7em;
      opacity: .6;
      margin-top: 2px;
    }
    /* Link buttons */
    .gls-link {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(0,0,0,.06);
      border-radius: 7px;
      font-size: .85em;
      font-weight: 600;
      color: inherit;
    }
    .gls-link::after {
      content: '›';
      opacity: .35;
      font-size: 1.15em;
      font-weight: 400;
    }
    .gls-link:hover {
      background: rgba(0,0,0,.12);
      opacity: 1;
    }

    /* === Frosted glass on all widget cards (added 2026-05-28) === */
    .widget {
      background-color: hsla(28, 20%, 15%, 0.62);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
