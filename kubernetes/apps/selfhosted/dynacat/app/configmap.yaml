---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynacat-config
data:
  dynacat.yml: |
    server:
      port: 8080
      assets-path: /app/assets

    theme:
      light: false
      background-color: 28 20 15
      primary-color: 38 70 85
      negative-color: 0 80 65
      contrast-multiplier: 1.2
      text-saturation-multiplier: 0.4
      custom-css-file: /assets/custom.css

    pages:
      # ── Home ───────────────────────────────────────────────────────────────
      - name: Accueil
        columns:
          # Col 2 : search + services + hacker-news
          - size: full
            widgets:
              - type: search
                search-engine: duckduckgo
                new-tab: true

              - type: monitor
                title: Favoris
                sites:
                  - title: Emby
                    url: https://emby.${SECRET_DOMAIN}
                    check-url: http://emby.media.svc.cluster.local:8096
                    icon: di:emby
                  - title: Navidrome
                    url: https://navidrome.${SECRET_DOMAIN}
                    icon: di:navidrome
                  - title: Immich
                    url: https://immich.${SECRET_DOMAIN}
                    icon: di:immich
                  - title: Nextcloud
                    url: https://nextcloud.${SECRET_DOMAIN}
                    icon: si:nextcloud
                  - title: Paperless
                    url: https://paperless.${SECRET_DOMAIN}
                    icon: di:paperless-ngx
                  - title: Audiobookshelf
                    url: https://audiobookshelf.${SECRET_DOMAIN}
                    check-url: http://audiobookshelf.media.svc.cluster.local
                    icon: di:audiobookshelf

              - type: hacker-news
                title: Hacker News
                cache: 30m
                update-interval: 30m
                limit: 10

          # Col 3 : météo + bookmarks
              - type: rss
                title: Monde & OSINT
                limit: 12
                collapse-after: 5
                feeds:
                  - url: https://www.bellingcat.com/feed/
                    title: Bellingcat
                  - url: https://feeds.bbci.co.uk/news/world/rss.xml
                    title: BBC World
                  - url: https://www.aljazeera.com/xml/rss/all.xml
                    title: Al Jazeera
              - type: rss
                title: Tech & Homelab
                limit: 10
                collapse-after: 5
                feeds:
                  - url: https://www.reddit.com/r/selfhosted.rss
                    title: r/selfhosted
                  - url: https://lobste.rs/rss
                    title: Lobsters
          - size: small
            widgets:
              - type: custom-api
                title: Météo
                allow-insecure-html: true
                cache: 15m
                url: "https://api.open-meteo.com/v1/forecast?latitude=48.8566&longitude=2.3522&current=temperature_2m,weather_code,apparent_temperature,wind_speed_10m,precipitation_probability&hourly=temperature_2m,weather_code,precipitation_probability&past_hours=0&forecast_hours=1&timezone=Europe%2FParis"
                template: |
                  <div id="dynacat-meteo" class="gls-trigger" onanimationstart="(function(el){fetch('https://api.open-meteo.com/v1/forecast?latitude=48.8566&longitude=2.3522&current=temperature_2m,weather_code,apparent_temperature,wind_speed_10m,precipitation_probability&hourly=temperature_2m,weather_code,precipitation_probability&past_hours=0&forecast_hours=48&timezone=Europe%2FParis').then(function(r){return r.json()}).then(function(d){var now=new Date(),cur=d.current,times=d.hourly.time,temps=d.hourly.temperature_2m,codes=d.hourly.weather_code,precips=d.hourly.precipitation_probability;function icon(c){if(c===0)return'☀️';if(c<=2)return'🌤';if(c<=3)return'⛅';if(c<=48)return'🌫';if(c<=57)return'🌦';if(c<=67)return'🌧';if(c<=77)return'❄️';if(c<=82)return'🌦';return'⛈';}function desc(c){if(c===0)return'Ensoleillé';if(c===1)return'Peu nuageux';if(c===2)return'Partiellement nuageux';if(c===3)return'Couvert';if(c<=48)return'Brouillard';if(c<=57)return'Bruine';if(c<=67)return'Pluie';if(c<=77)return'Neige';if(c<=82)return'Averses';return'Orage';}var html='<div style=\'text-align:center;padding:4px 0 10px\'><div style=\'font-size:2.2em;font-weight:700;line-height:1\'>'+Math.round(cur.temperature_2m)+'°</div><div style=\'font-size:.88em;margin-top:5px\'>'+icon(cur.weather_code)+' '+desc(cur.weather_code)+'</div><div style=\'font-size:.75em;opacity:.6;margin-top:3px\'>Ressenti '+Math.round(cur.apparent_temperature)+'° &nbsp;💨 '+Math.round(cur.wind_speed_10m)+' km/h</div></div><div style=\'display:flex;flex-direction:column;gap:3px\'>';var apc=String.fromCharCode(39),DAYS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],MONTHS=['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'];function dkey(t){return t.getFullYear()+'-'+t.getMonth()+'-'+t.getDate();}function dlabel(t){if(dkey(t)===dkey(now))return'Aujourd'+apc+'hui';var tom=new Date(now.getTime()+86400000);if(dkey(t)===dkey(tom))return'Demain';return DAYS[t.getDay()]+' '+t.getDate()+' '+MONTHS[t.getMonth()];}var lastDay='';for(var i=0;i<times.length;i++){var t=new Date(times[i]);if(t<now)continue;if(t.getHours()%2!==0)continue;var dl=dlabel(t);if(dl!==lastDay){html+='<div style=\'font-size:.62em;font-weight:700;letter-spacing:.08em;color:#f0d9a0;text-transform:uppercase;padding:4px 0 2px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:1px\'>'+dl+'</div>';lastDay=dl;}var h=String(t.getHours()).padStart(2,'0')+'h';var temp=Math.round(temps[i]);var p=precips[i];html+='<div style=\'display:flex;align-items:center;gap:6px;font-size:.8em\'><span style=\'min-width:26px;opacity:.6\'>'+h+'</span><span>'+icon(codes[i])+'</span><span style=\'flex:1;font-size:.82em;color:#93c5fd\'>'+(p>=20?'💧'+p+'%':'')+'</span><span style=\'font-weight:600\'>'+temp+'°</span></div>';}html+='</div><div style=\'text-align:center;font-size:.7em;opacity:.35;margin-top:8px\'>📍 Paris, France</div>';el.innerHTML=html;}).catch(function(e){el.textContent='Err: '+e.message;});})(this)">Chargement...</div>

              - type: custom-api
                title: Crypto
                allow-insecure-html: true
                cache: 5m
                url: "https://api.coingecko.com/api/v3/ping"
                template: |
                  <div id="dynacat-crypto" class="gls-trigger" onanimationstart="(function(el){fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,monero,lightchain-ai&vs_currencies=usd&include_24hr_change=true').then(function(r){return r.json()}).then(function(d){var rows=[['₿','Bitcoin','bitcoin'],['ɱ','Monero','monero'],['◆','Lightchain AI','lightchain-ai']];var h='<div style=\'display:flex;flex-direction:column;gap:9px\'>';rows.forEach(function(c){var o=d[c[2]];if(!o)return;var price=o.usd,chg=o.usd_24h_change||0,col=chg<0?'#ef4444':'#22c55e';var ps=price>=1000?Math.round(price).toLocaleString('en-US'):(price<1?price.toFixed(4):price.toFixed(2));h+='<div style=\'display:flex;justify-content:space-between;align-items:center\'><span style=\'font-weight:600;font-size:.9em\'>'+c[0]+' '+c[1]+'</span><span style=\'text-align:right;line-height:1.15\'><div style=\'font-weight:600\'>$'+ps+'</div><div style=\'font-size:.72em;color:'+col+'\'>'+(chg>=0?'+':'')+chg.toFixed(1)+'%</div></span></div>';});h+='</div>';el.innerHTML=h;}).catch(function(){el.innerHTML='<div style=\'font-size:.85em;opacity:.5\'>Crypto indispo</div>';});})(this)">Chargement...</div>
              - type: markets
                title: Marchés
                markets:
                  - symbol: "^GSPC"
                    name: S&P 500
                  - symbol: "^IXIC"
                    name: Nasdaq
                  - symbol: "^FCHI"
                    name: CAC 40
                  - symbol: "GC=F"
                    name: Or
              - type: bookmarks
                title: Liens
                groups:
                  - title: Infrastructure
                    links:
                      - title: home-ops
                        url: https://github.com/thomloy/home-ops
                        icon: di:github
                      - title: Grafana
                        url: https://grafana.${SECRET_DOMAIN}
                        icon: di:grafana
                      - title: Status
                        url: https://status.${SECRET_DOMAIN}
                        icon: di:gatus
                  - title: Médias
                    links:
                      - title: Emby
                        url: https://emby.${SECRET_DOMAIN}
                        icon: di:emby
                      - title: Audiobookshelf
                        url: https://audiobookshelf.${SECRET_DOMAIN}
                        icon: di:audiobookshelf
                      - title: Radarr
                        url: https://radarr.${SECRET_DOMAIN}
                        icon: di:radarr
                      - title: Sonarr
                        url: https://sonarr.${SECRET_DOMAIN}
                        icon: di:sonarr
                      - title: Sabnzbd
                        url: https://sabnzbd.${SECRET_DOMAIN}
                        icon: di:sabnzbd
                      - title: qBittorrent
                        url: https://qbittorrent.${SECRET_DOMAIN}
                        icon: di:qbittorrent
                  - title: Outils
                    links:
                      - title: Paperless
                        url: https://paperless.${SECRET_DOMAIN}
                        icon: di:paperless-ngx
                      - title: Tandoor
                        url: https://tandoor.${SECRET_DOMAIN}
                        icon: si:tandoorrecipes
                      - title: Nextcloud
                        url: https://nextcloud.${SECRET_DOMAIN}
                        icon: si:nextcloud
                      - title: IT-Tools
                        url: https://it-tools.${SECRET_DOMAIN}
                        icon: di:it-tools
                      - title: Actual Budget
                        url: https://budget.${SECRET_DOMAIN}
                        icon: si:actualbudget

      # ── Media ──────────────────────────────────────────────────────────────
      - name: Média
        columns:
          - size: small
            widgets:
              - type: custom-api
                title: Lecture en cours
                allow-insecure-html: true
                cache: 30s
                url: "http://emby.media.svc.cluster.local:8096/Sessions?ActiveWithinSeconds=300&api_key=$${EMBY_API_KEY}"
                template: |
                  {{$any := false}}
                  <div style="display:flex;flex-direction:column;gap:8px">
                  {{range .JSON.Array "@this"}}
                  {{if (.String "NowPlayingItem.Name")}}
                  {{$any = true}}
                  {{$paused := eq (.String "PlayState.IsPaused") "true"}}
                  {{$h := .Int "NowPlayingItem.Height"}}
                  <div style="display:flex;gap:10px;align-items:flex-start;padding:10px;background:rgba(0,0,0,.06);border-radius:6px">
                    <img src="http://emby.media.svc.cluster.local:8096/Items/{{if (.String "NowPlayingItem.SeriesId")}}{{.String "NowPlayingItem.SeriesId"}}{{else}}{{.String "NowPlayingItem.Id"}}{{end}}/Images/Primary?maxHeight=100&api_key=$${EMBY_API_KEY}" style="width:45px;min-width:45px;height:67px;object-fit:cover;border-radius:4px;flex-shrink:0">
                    <div style="min-width:0;flex:1">
                      <div style="font-weight:700;font-size:.9em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{if $paused}}<span style="color:#f59e0b">●</span>{{else}}<span style="color:#22c55e">●</span>{{end}} {{if (.String "NowPlayingItem.SeriesName")}}{{.String "NowPlayingItem.SeriesName"}}{{else}}{{.String "NowPlayingItem.Name"}}{{end}}</div>
                      {{if (.String "NowPlayingItem.SeriesName")}}<div style="font-size:.75em;opacity:.7;margin-top:2px">{{printf "S%02dE%02d" (.Int "NowPlayingItem.ParentIndexNumber") (.Int "NowPlayingItem.IndexNumber")}} · {{.String "NowPlayingItem.Name"}}</div>{{end}}
                      <div style="font-size:.75em;opacity:.65;margin-top:2px">{{if (.String "NowPlayingItem.SeriesName")}}TV{{else}}Film{{end}} · {{if gt $h 2000}}4K{{else if gt $h 1000}}1080p{{else if gt $h 680}}720p{{else}}SD{{end}} · {{.String "PlayState.PlayMethod"}}</div>
                      <div style="font-size:.75em;opacity:.65;margin-top:1px">👤 {{.String "UserName"}} · {{.String "Client"}} ({{.String "DeviceName"}})</div>
                      <div style="font-size:.75em;font-weight:600;margin-top:3px">{{if $paused}}⏸ En pause{{else}}▶ En lecture{{end}}</div>
                      <div class="gls-trigger" data-pos='{{.Int "PlayState.PositionTicks"}}' data-dur='{{.Int "NowPlayingItem.RunTimeTicks"}}' onanimationstart="(function(el){var p=+el.dataset.pos,d=+el.dataset.dur;if(!d)return;var pct=Math.round(p/d*100);function fmt(t){var s=Math.floor(t/1e7),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sc=s%60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(sc).padStart(2,'0');}el.innerHTML='<div style=\'margin-top:4px\'><div style=\'display:flex;justify-content:space-between;font-size:.7em;opacity:.5;margin-bottom:2px\'><span>'+fmt(p)+'</span><span>-'+fmt(d-p)+'</span></div><div style=\'background:rgba(255,255,255,.1);border-radius:3px;height:3px\'><div style=\'background:#3b82f6;width:'+pct+'%;height:3px;border-radius:3px\'></div></div></div>';})(this)"></div>
                    </div>
                  </div>
                  {{end}}
                  {{end}}
                  {{if not $any}}<div style="font-size:.85em;opacity:.5">Aucune lecture en cours</div>{{end}}
                  </div>

              - type: custom-api
                title: Musique en cours
                allow-insecure-html: true
                cache: 30s
                url: "http://navidrome.media.svc.cluster.local:4533/rest/getNowPlaying.view?u=$${NAVIDROME_USER}&p=$${NAVIDROME_PASS}&c=dynacat&v=1.16.1&f=json"
                template: |
                  {{$np := .JSON.Array "subsonic-response.nowPlaying.entry"}}
                  {{if eq (len $np) 0}}
                  <div style="font-size:.85em;opacity:.5">Aucune lecture musicale</div>
                  {{else}}
                  <div style="display:flex;flex-direction:column;gap:6px">
                  {{range $np}}
                  <div style="display:flex;gap:8px;align-items:center;padding:6px 8px;background:rgba(0,0,0,.06);border-radius:6px">
                    <img src="http://navidrome.media.svc.cluster.local:4533/rest/getCoverArt.view?id={{.String "coverArt"}}&u=$${NAVIDROME_USER}&p=$${NAVIDROME_PASS}&c=dynacat&v=1.16.1" style="width:40px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0">
                    <div style="min-width:0">
                      <div style="font-weight:600;font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">▶ {{.String "title"}}</div>
                      <div style="font-size:.7em;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{.String "artist"}}</div>
                    </div>
                  </div>
                  {{end}}
                  </div>
                  {{end}}

              - type: custom-api
                title: Téléchargements
                allow-insecure-html: true
                cache: 30s
                url: "http://radarr.downloads.svc.cluster.local:7878/api/v3/health?apikey=$${RADARR_API_KEY}"
                template: |
                  <div id="dynacat-dlq" class="gls-trigger" data-kr="$${RADARR_API_KEY}" data-ks="$${SONARR_API_KEY}" data-krd="$${READARR_API_KEY}" data-d="${SECRET_DOMAIN}" onanimationstart="(function(el){var d=el.dataset.d,kr=el.dataset.kr,ks=el.dataset.ks,krd=el.dataset.krd;Promise.all([fetch('https://radarr.'+d+'/api/v3/queue?apikey='+kr+'&pageSize=5').then(function(r){return r.json()}).catch(function(){return{records:[]}}),fetch('https://sonarr.'+d+'/api/v3/queue?apikey='+ks+'&pageSize=5').then(function(r){return r.json()}).catch(function(){return{records:[]}}),fetch('https://readarr.'+d+'/api/v1/queue?apikey='+krd+'&pageSize=3').then(function(r){return r.json()}).catch(function(){return{records:[]}})]).then(function(res){var all=[];(res[0].records||[]).forEach(function(r){all.push(['🎬',(r.movie&&r.movie.title)||r.title||'',r.status,r.timeleft||''])});(res[1].records||[]).forEach(function(r){all.push(['📺',(r.series&&r.series.title)||r.title||'',r.status,r.timeleft||''])});(res[2].records||[]).forEach(function(r){all.push(['📚',(r.book&&r.book.title)||r.title||'',r.status,r.timeleft||''])});if(!all.length){el.innerHTML='<div style=\'opacity:.5;font-size:.85em\'>Aucun téléchargement</div>';return;}var col={downloading:\'#3b82f6\',completed:\'#22c55e\',failed:\'#ef4444\',paused:\'#f59e0b\',importPending:\'#a855f7\',importing:\'#a855f7\'};var lbl={downloading:\'⬇\',queued:\'⏳\',paused:\'⏸\',completed:\'✓\',failed:\'✗\',importPending:\'📥\',importing:\'📥\'};var h=\'\';all.forEach(function(r){var c=col[r[2]]||\'#6b7280\';h+=\'<div style=\'margin-bottom:4px;padding:5px 8px;background:rgba(0,0,0,.1);border-radius:5px;border-left:3px solid \'+c+\'\'><div style=\'font-size:.8em;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis\'>\'+r[0]+\' \'+r[1]+\'</div><div style=\'font-size:.68em;opacity:.6\'>\'+( lbl[r[2]]||r[2])+(r[3]?\' · \'+r[3]:\'\')+\'</div></div>\';});el.innerHTML=h;});})(this)">Chargement...</div>

              - type: custom-api
                title: Liens
                allow-insecure-html: true
                cache: 1h
                url: "http://radarr.downloads.svc.cluster.local:7878/api/v3/system/status?apikey=$${RADARR_API_KEY}"
                template: |
                  <div style="display:flex;flex-direction:column;gap:4px">
                    <a href="https://emby.${SECRET_DOMAIN}" target="_blank" class="gls-link">Emby</a>
                    <a href="https://audiobookshelf.${SECRET_DOMAIN}" target="_blank" class="gls-link">Audiobookshelf</a>
                    <a href="https://seerr.${SECRET_DOMAIN}" target="_blank" class="gls-link">Seerr</a>
                    <a href="https://radarr.${SECRET_DOMAIN}" target="_blank" class="gls-link">Radarr</a>
                    <a href="https://sonarr.${SECRET_DOMAIN}" target="_blank" class="gls-link">Sonarr</a>
                    <a href="https://readarr.${SECRET_DOMAIN}" target="_blank" class="gls-link">Readarr</a>
                    <a href="https://lidarr.${SECRET_DOMAIN}" target="_blank" class="gls-link">Lidarr</a>
                    <a href="https://navidrome.${SECRET_DOMAIN}" target="_blank" class="gls-link">Navidrome</a>
                  </div>

          - size: full
            widgets:
              - type: group
                widgets:
                  - type: custom-api
                    title: Ma bibliothèque
                    allow-insecure-html: true
                    cache: 5m
                    url: "http://emby.media.svc.cluster.local:8096/Items/Counts?api_key=$${EMBY_API_KEY}"
                    template: |
                      {{$movies := .JSON.Int "MovieCount"}}
                      {{$series := .JSON.Int "SeriesCount"}}
                      {{$episodes := .JSON.Int "EpisodeCount"}}

                      <div style="display:flex;flex-direction:column;gap:16px">
                      <div>
                        <div class="gls-section-hdr">BIBLIOTHÈQUE</div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap">
                          <div style="flex:1;min-width:80px;padding:10px 14px;background:rgba(0,0,0,.1);border-radius:8px;text-align:center">
                            <div style="font-size:1.4em;font-weight:700;color:#3b82f6">{{$movies}}</div>
                            <div style="font-size:.7em;opacity:.6;margin-top:1px">🎬 Films</div>
                          </div>
                          <div style="flex:1;min-width:80px;padding:10px 14px;background:rgba(0,0,0,.1);border-radius:8px;text-align:center">
                            <div style="font-size:1.4em;font-weight:700;color:#8b5cf6">{{$series}}</div>
                            <div style="font-size:.7em;opacity:.6;margin-top:1px">📺 Séries</div>
                          </div>
                          <div style="flex:1;min-width:80px;padding:10px 14px;background:rgba(0,0,0,.1);border-radius:8px;text-align:center">
                            <div style="font-size:1.4em;font-weight:700;color:#06b6d4">{{$episodes}}</div>
                            <div style="font-size:.7em;opacity:.6;margin-top:1px">🎞 Épisodes</div>
                          </div>
                          <div style="flex:1;min-width:80px;padding:10px 14px;background:rgba(0,0,0,.1);border-radius:8px;text-align:center">
                            <div id="dynacat-nsong" style="font-size:1.4em;font-weight:700;color:#f59e0b">…</div>
                            <div style="font-size:.7em;opacity:.6;margin-top:1px">🎵 Morceaux</div>
                          </div>
                        </div>
                      </div>
                      <div class="gls-trigger" onanimationstart="if(!window.__gls){window.__gls=true;document.addEventListener('click',function(e){var b=e.target;while(b&&!b.classList.contains('widget-group-title'))b=b.parentElement;if(!b)return;var t=b.parentElement;var bs=[].slice.call(t.children);var i=bs.indexOf(b);if(i<0)return;document.querySelectorAll('.widget-header.gap-20').forEach(function(o){if(o===t||o.children.length!==t.children.length)return;var ob=o.children[i];if(ob&&!ob.classList.contains('widget-group-title-current'))ob.click();});},true);}"></div>
                      <div class="gls-trigger" data-u="$${NAVIDROME_USER}" data-p="$${NAVIDROME_PASS}" data-d="${SECRET_DOMAIN}" onanimationstart="(function(el){var u=el.dataset.u,p=el.dataset.p,d=el.dataset.d;function page(off,tot){fetch('https://navidrome.'+d+'/rest/getAlbumList2.view?u='+u+'&p='+p+'&c=dynacat&v=1.16.1&f=json&type=alphabeticalByArtist&size=500&offset='+off).then(function(r){return r.json()}).then(function(j){var al=(j['subsonic-response']&&j['subsonic-response'].albumList2&&j['subsonic-response'].albumList2.album)||[];var n=al.reduce(function(s,a){return s+(a.songCount||0)},0);tot+=n;var el2=document.getElementById('dynacat-nsong');if(al.length===500){page(off+500,tot)}else if(el2){el2.textContent=tot}}).catch(function(){var el2=document.getElementById('dynacat-nsong');if(el2)el2.textContent='?'})}page(0,0)})(this)"></div>
