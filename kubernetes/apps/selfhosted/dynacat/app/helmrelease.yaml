---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dynacat
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dynacat
  values:
    controllers:
      dynacat:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: panonim/dynacat
              tag: "2.3.1"
            envFrom:
              - secretRef:
                  name: dynacat-secret
            env:
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: github-status-token-secret
                    key: token
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false

    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: dynacat
        ports:
          http:
            port: 8080

    persistence:
      config:
        type: configMap
        name: dynacat-config
        globalMounts:
          - path: /app/config/dynacat.yml
            subPath: dynacat.yml
          - path: /app/assets/custom.css
            subPath: custom.css
      bg:
        type: configMap
        name: dynacat-bg
        globalMounts:
          - path: /app/assets/bg.jpg
            subPath: bg.jpg

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            alerts:
              - type: pushover
            conditions: ["[STATUS] < 500"]
            ui:
              hide-hostname: true
        hostnames:
          - home.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
