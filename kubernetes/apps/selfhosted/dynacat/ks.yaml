---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dynacat
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: dynacat
  dependsOn:
    - name: onepassword
      namespace: external-secrets
  interval: 1h
  path: "./kubernetes/apps/selfhosted/dynacat/app"
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
