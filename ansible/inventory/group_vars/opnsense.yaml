---
# Clés OPNsense récupérées depuis 1Password (item: opnsense)
opnsense_api_key: "{{ lookup('community.general.onepassword', 'opnsense', field='OPNSENSE_API_KEY') }}"
opnsense_api_secret: "{{ lookup('community.general.onepassword', 'opnsense', field='OPNSENSE_API_SECRET') }}"

# Firewall aliases
opnsense_aliases:
  - name: "kubernetes_nodes"
    type: host
    content:
      - "{{ node01_ip }}"
      - "{{ node02_ip }}"
      - "{{ node03_ip }}"
    description: "Talos nodes"
  - name: "kubernetes_pods"
    type: network
    content:
      - "{{ pod_cidr }}"
    description: "Pod CIDR"
  - name: "kubernetes_services"
    type: network
    content:
      - "{{ service_cidr }}"
    description: "Service CIDR"
  - name: "nas"
    type: host
    content:
      - "{{ nas_ip }}"
    description: "TrueNAS SCALE"

# Règles LAN → Kubernetes
opnsense_firewall_rules:
  - description: "Allow LAN to Kubernetes API"
    interface: "lan"
    source_net: "lan"
    destination_net: "{{ cluster_api_addr }}"
    destination_port: "6443"
    protocol: "TCP"
    action: "pass"
  - description: "Allow Kubernetes nodes outbound"
    interface: "lan"
    source_net: "kubernetes_nodes"
    destination_net: "any"
    action: "pass"
  - description: "Allow NAS NFS from Kubernetes"
    interface: "lan"
    source_net: "kubernetes_nodes"
    destination_net: "nas"
    destination_port: "2049"
    protocol: "TCP/UDP"
    action: "pass"
