---
# Configuration OPNsense via collection ansibleguy.opnsense.
# Gère les aliases, règles firewall et DNS statique.
#
# Usage:
#   ansible-playbook ansible/playbooks/network.yaml --ask-vault-pass
#   ansible-playbook ansible/playbooks/network.yaml --tags aliases
#   ansible-playbook ansible/playbooks/network.yaml --tags rules
#   ansible-playbook ansible/playbooks/network.yaml --tags dns
#
# Prérequis:
#   1. Activer l'API dans OPNsense : System > Access > Users > ton user > API keys
#   2. ansible-galaxy collection install ansibleguy.opnsense
#   3. Encrypter les clés : ansible-vault encrypt_string 'KEY' --name 'opnsense_api_key'

- name: Configure OPNsense
  hosts: opnsense
  gather_facts: false
  vars:
    ansible_connection: local  # tout via API, pas SSH

  tasks:
    # ── Aliases ───────────────────────────────────────────────────────────────
    - name: Create firewall aliases
      tags: [aliases]
      ansibleguy.opnsense.alias:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        content: "{{ item.content }}"
        description: "{{ item.description | default('') }}"
        ssl_verify: false
        state: present
      loop: "{{ opnsense_aliases }}"
      loop_control:
        label: "{{ item.name }}"

    # ── Règles firewall ───────────────────────────────────────────────────────
    - name: Create firewall rules
      tags: [rules]
      ansibleguy.opnsense.rule:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        description: "{{ item.description }}"
        interface: "{{ item.interface }}"
        source_net: "{{ item.source_net }}"
        destination_net: "{{ item.destination_net }}"
        destination_port: "{{ item.destination_port | default(omit) }}"
        protocol: "{{ item.protocol | default(omit) }}"
        action: "{{ item.action }}"
        ssl_verify: false
        state: present
      loop: "{{ opnsense_firewall_rules }}"
      loop_control:
        label: "{{ item.description }}"

    # ── DNS statique (Unbound) ────────────────────────────────────────────────
    - name: Create static DNS entries for cluster services
      tags: [dns]
      ansibleguy.opnsense.unbound_host:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        hostname: "{{ item.hostname }}"
        domain: "kryzql.space"
        server: "{{ item.ip }}"
        description: "{{ item.description | default('') }}"
        ssl_verify: false
        state: present
      loop:
        - hostname: "k8s"
          ip: "192.168.42.100"
          description: "Kubernetes API VIP"
        - hostname: "gateway"
          ip: "192.168.42.110"
          description: "Internal Envoy Gateway"
        - hostname: "truenas"
          ip: "192.168.42.50"
          description: "TrueNAS SCALE NAS"
      loop_control:
        label: "{{ item.hostname }}.kryzql.space"

    # ── BGP (Cilium) ──────────────────────────────────────────────────────────
    - name: Configure BGP neighbor for Cilium
      tags: [bgp]
      ansibleguy.opnsense.frr_bgp_neighbor:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        name: "kubernetes-nodes"
        peer_ip: "192.168.42.41"  # node01 comme référence
        remote_as: "64514"
        multi_hop: false
        ssl_verify: false
        state: present
      loop:
        - ip: "192.168.42.41"
          name: "node01"
        - ip: "192.168.42.42"
          name: "node02"
        - ip: "192.168.42.43"
          name: "node03"
      loop_control:
        label: "BGP {{ item.name }} ({{ item.ip }})"
