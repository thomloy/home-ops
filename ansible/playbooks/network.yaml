---
# Configuration OPNsense via collection ansibleguy.opnsense.
# Gère les aliases, règles firewall et DNS statique.
#
# Usage:
#   ansible-playbook ansible/playbooks/network.yaml --ask-vault-pass
#   ansible-playbook ansible/playbooks/network.yaml --tags aliases
#   ansible-playbook ansible/playbooks/network.yaml --tags rules
#   ansible-playbook ansible/playbooks/network.yaml --tags dns
#
# Prérequis:
#   1. Activer l'API dans OPNsense : System > Access > Users > ton user > API keys
#   2. Stocker les clés dans 1Password (item: opnsense, champs: OPNSENSE_API_KEY / OPNSENSE_API_SECRET)
#   3. ansible-galaxy collection install -r requirements.yaml

- name: Configure OPNsense
  hosts: opnsense
  gather_facts: false
  vars:
    ansible_connection: local  # tout via API, pas SSH

  tasks:
    # ── Aliases ───────────────────────────────────────────────────────────────
    - name: Create firewall aliases
      tags: [aliases]
      ansibleguy.opnsense.alias:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        content: "{{ item.content }}"
        description: "{{ item.description | default('') }}"
        ssl_verify: false
        state: present
      loop: "{{ opnsense_aliases }}"
      loop_control:
        label: "{{ item.name }}"

    # ── Règles firewall ───────────────────────────────────────────────────────
    - name: Create firewall rules
      tags: [rules]
      ansibleguy.opnsense.rule:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        description: "{{ item.description }}"
        interface: "{{ item.interface }}"
        source_net: "{{ item.source_net }}"
        destination_net: "{{ item.destination_net }}"
        destination_port: "{{ item.destination_port | default(omit) }}"
        protocol: "{{ item.protocol | default(omit) }}"
        action: "{{ item.action }}"
        ssl_verify: false
        state: present
      loop: "{{ opnsense_firewall_rules }}"
      loop_control:
        label: "{{ item.description }}"

    # ── DNS statique — domaine .internal ─────────────────────────────────────
    # Entrées nécessaires avant ExternalDNS (infra bootstrap)
    # Les entrées *.kryzql.space des apps sont gérées dynamiquement par ExternalDNS
    - name: Create static DNS entries (.internal)
      tags: [dns]
      ansibleguy.opnsense.unbound_host:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        hostname: "{{ item.hostname }}"
        domain: "internal"
        server: "{{ item.ip }}"
        description: "{{ item.description }}"
        ssl_verify: false
        state: present
      loop:
        - hostname: opnsense
          ip: "{{ bgp_router_ip }}"
          description: "OPNsense router (requis par ExternalDNS webhook)"
        - hostname: node01
          ip: "{{ node01_ip }}"
          description: "Talos node01 (blackbox-exporter, scrapeconfig)"
        - hostname: node02
          ip: "{{ node02_ip }}"
          description: "Talos node02"
        - hostname: node03
          ip: "{{ node03_ip }}"
          description: "Talos node03"
        - hostname: truenas
          ip: "{{ nas_ip }}"
          description: "TrueNAS SCALE NAS"
        - hostname: jetkvm-1
          ip: "{{ jetkvm1_ip }}"
          description: "JetKVM node01"
        - hostname: jetkvm-2
          ip: "{{ jetkvm2_ip }}"
          description: "JetKVM node02"
        - hostname: jetkvm-3
          ip: "{{ jetkvm3_ip }}"
          description: "JetKVM node03"
      loop_control:
        label: "{{ item.hostname }}.internal"

    # ── DNS statique — domaine {{ cloudflare_domain }} (infra uniquement) ────
    - name: Create static DNS entries ({{ cloudflare_domain }})
      tags: [dns]
      ansibleguy.opnsense.unbound_host:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        hostname: "{{ item.hostname }}"
        domain: "{{ cloudflare_domain }}"
        server: "{{ item.ip }}"
        description: "{{ item.description }}"
        ssl_verify: false
        state: present
      loop:
        - hostname: k8s
          ip: "{{ cluster_api_addr }}"
          description: "Kubernetes API VIP"
        - hostname: gateway
          ip: "{{ cluster_gateway_internal }}"
          description: "Internal Envoy Gateway"
        - hostname: truenas
          ip: "{{ nas_ip }}"
          description: "TrueNAS SCALE NAS"
      loop_control:
        label: "{{ item.hostname }}.{{ cloudflare_domain }}"

    # ── BGP (Cilium) ──────────────────────────────────────────────────────────
    - name: Enable FRR BGP daemon
      tags: [bgp]
      ansibleguy.opnsense.frr_bgp_general:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        as: "{{ bgp_router_asn }}"
        router_id: "{{ bgp_router_ip }}"
        enabled: true
        ssl_verify: false

    - name: Configure prefix list — accept routes advertised by Cilium nodes
      tags: [bgp]
      ansibleguy.opnsense.frr_bgp_prefix_list:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        name: "kubernetes-lb"
        seq: 10
        action: "permit"
        network: "{{ node_subnet }}"
        ssl_verify: false
        state: present

    - name: Configure route-map — apply prefix list inbound
      tags: [bgp]
      ansibleguy.opnsense.frr_bgp_route_map:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        name: "accept-kubernetes-lb"
        action: "permit"
        id: 10
        match_prefix_list: "kubernetes-lb"
        ssl_verify: false
        state: present

    - name: Configure BGP neighbors (Kubernetes nodes)
      tags: [bgp]
      ansibleguy.opnsense.frr_bgp_neighbor:
        firewall: "{{ ansible_host }}"
        api_key: "{{ opnsense_api_key }}"
        api_secret: "{{ opnsense_api_secret }}"
        name: "{{ item.name }}"
        peer_ip: "{{ item.ip }}"
        remote_as: "{{ bgp_node_asn }}"
        route_map_in: "accept-kubernetes-lb"
        multi_hop: false
        ssl_verify: false
        state: present
      loop:
        - ip: "{{ node01_ip }}"
          name: "node01"
        - ip: "{{ node02_ip }}"
          name: "node02"
        - ip: "{{ node03_ip }}"
          name: "node03"
      loop_control:
        label: "BGP {{ item.name }} ({{ item.ip }})"
