---
# Helper pour créer les secrets vault la première fois.
# NE PAS committer les valeurs réelles — ce fichier montre la procédure.
#
# Usage:
#   ansible-vault encrypt_string 'YOUR_TRUENAS_API_KEY' --name 'truenas_api_key'
#   ansible-vault encrypt_string 'YOUR_OPNSENSE_API_KEY' --name 'opnsense_api_key'
#   ansible-vault encrypt_string 'YOUR_OPNSENSE_SECRET' --name 'opnsense_api_secret'
#
# Stocker le vault password dans 1Password et créer ~/.ansible_vault_pass :
#   echo "your-vault-password" > ~/.ansible_vault_pass
#   chmod 600 ~/.ansible_vault_pass
#
# Puis dans ansible.cfg :
#   vault_password_file = ~/.ansible_vault_pass

- name: Verify vault secrets are accessible
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check TrueNAS API key is defined
      ansible.builtin.assert:
        that: truenas_api_key is defined and truenas_api_key != ''
        fail_msg: "truenas_api_key not set — run: ansible-vault encrypt_string 'KEY' --name 'truenas_api_key'"

    - name: Check OPNsense API credentials are defined
      ansible.builtin.assert:
        that:
          - opnsense_api_key is defined and opnsense_api_key != ''
          - opnsense_api_secret is defined and opnsense_api_secret != ''
        fail_msg: "OPNsense credentials not set in group_vars/opnsense.yaml"

    - name: All secrets OK
      ansible.builtin.debug:
        msg: "✅ Tous les secrets vault sont accessibles"
