---
# Vérifie que tous les secrets 1Password sont accessibles avant de lancer les playbooks.
#
# Usage:
#   ansible-playbook ansible/playbooks/vault-setup.yaml

- name: Verify 1Password secrets are accessible
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check TrueNAS API key
      ansible.builtin.assert:
        that: lookup('community.general.onepassword', 'truenas', field='TRUENAS_API_KEY') != ''
        fail_msg: "TRUENAS_API_KEY manquant dans 1Password (item: truenas)"

    - name: Check OPNsense API key
      ansible.builtin.assert:
        that: lookup('community.general.onepassword', 'opnsense', field='OPNSENSE_API_KEY') != ''
        fail_msg: "OPNSENSE_API_KEY manquant dans 1Password (item: opnsense)"

    - name: Check OPNsense API secret
      ansible.builtin.assert:
        that: lookup('community.general.onepassword', 'opnsense', field='OPNSENSE_API_SECRET') != ''
        fail_msg: "OPNSENSE_API_SECRET manquant dans 1Password (item: opnsense)"

    - name: Check cluster network vars
      ansible.builtin.assert:
        that:
          - lookup('community.general.onepassword', 'cluster-network', field='CLUSTER_API_IP') != ''
          - lookup('community.general.onepassword', 'cluster-network', field='NAS_IP') != ''
          - lookup('community.general.onepassword', 'cluster-network', field='SECRET_DOMAIN') != ''
        fail_msg: "Variables manquantes dans 1Password (item: cluster-network)"

    - name: All secrets OK
      ansible.builtin.debug:
        msg: "✅ Tous les secrets 1Password sont accessibles"
