---
# Bootstrap complet du cluster Talos + Flux depuis zéro.
# Prérequis : talosctl, kubectl, flux, helmfile, talhelper, op CLI installés (gérés via mise)
#
# Usage (depuis le répertoire ansible/, ou via task runner) :
#   task ansible:bootstrap
#   ansible-playbook playbooks/bootstrap.yaml
#   ansible-playbook playbooks/bootstrap.yaml --tags talos   # seulement Talos
#   ansible-playbook playbooks/bootstrap.yaml --tags flux    # seulement Flux

- name: Generate Talos configs
  hosts: localhost
  gather_facts: false
  tags: [talos, configs]
  vars:
    talos_dir: "{{ playbook_dir }}/../../talos"
    repo_dir: "{{ playbook_dir }}/../.."
  tasks:
    # ── Retrieve age.key first — required by talhelper genconfig to decrypt talsecret ──
    - name: "Retrieve age.key from 1Password (item: sops / SOPS_PRIVATE_KEY)"
      ansible.builtin.shell: >
        op item get "{{ op_sops_item }}"
        --fields label="{{ op_sops_field }}"
        --reveal
        > {{ repo_dir }}/age.key
      args:
        creates: "{{ repo_dir }}/age.key"
      no_log: true

    - name: Check talconfig.yaml exists
      ansible.builtin.stat:
        path: "{{ talos_dir }}/talconfig.yaml"
      register: talconfig

    - name: Fail if talconfig.yaml missing
      ansible.builtin.fail:
        msg: "talos/talconfig.yaml not found"
      when: not talconfig.stat.exists

    # ── Generate talsecret.sops.yaml if not present (fresh install only) ─────
    - name: Check talsecret.sops.yaml exists
      ansible.builtin.stat:
        path: "{{ talos_dir }}/talsecret.sops.yaml"
      register: talsecret

    - name: Generate and encrypt talsecret.sops.yaml
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          talhelper gensecret | sops --filename-override talos/talsecret.sops.yaml --encrypt /dev/stdin > {{ talos_dir }}/talsecret.sops.yaml
        executable: /bin/bash
      when: not talsecret.stat.exists
      changed_when: true

    - name: Generate Talos node configs via talhelper
      ansible.builtin.command:
        cmd: talhelper genconfig
        chdir: "{{ talos_dir }}"
      environment:
        SOPS_AGE_KEY_FILE: "{{ playbook_dir }}/../../age.key"
      changed_when: true

- name: Apply Talos configs to nodes
  hosts: kubernetes
  gather_facts: false
  serial: 1
  tags: [talos, apply]
  vars:
    talosconfig_path: "{{ talos_config_dir }}/talosconfig"
  tasks:
    - name: Apply config to node (insecure — first apply)
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          talosctl apply-config
          --nodes {{ ansible_host }}
          --file {{ talos_config_dir }}/{{ talos_cluster_name }}-{{ inventory_hostname }}.yaml
          --insecure
      environment:
        TALOSCONFIG: "{{ talosconfig_path }}"
      changed_when: true

    - name: Wait for node Talos API to be ready
      delegate_to: localhost
      ansible.builtin.command:
        cmd: talosctl version --nodes {{ ansible_host }}
      environment:
        TALOSCONFIG: "{{ talosconfig_path }}"
      register: version_check
      until: version_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: Bootstrap etcd
  hosts: kubernetes
  gather_facts: false
  tags: [talos, etcd]
  vars:
    talosconfig_path: "{{ talos_config_dir }}/talosconfig"
  tasks:
    - name: Bootstrap etcd on first control-plane
      delegate_to: localhost
      ansible.builtin.command:
        cmd: talosctl bootstrap --nodes {{ ansible_host }}
      environment:
        TALOSCONFIG: "{{ talosconfig_path }}"
      when: talos_bootstrap | bool
      register: bootstrap_result
      changed_when: bootstrap_result.rc == 0
      failed_when:
        - bootstrap_result.rc != 0
        - '"etcd is already bootstrapped" not in bootstrap_result.stderr'

    - name: Retrieve kubeconfig
      delegate_to: localhost
      ansible.builtin.command:
        cmd: talosctl kubeconfig {{ talos_config_dir }}/../../kubeconfig --nodes {{ ansible_host }} --force --merge=false
      environment:
        TALOSCONFIG: "{{ talosconfig_path }}"
      register: kubeconfig_result
      until: kubeconfig_result.rc == 0
      retries: 30
      delay: 10
      when: talos_bootstrap | bool
      changed_when: true

    - name: Wait for all nodes to appear (Ready=False is expected — CNI not yet deployed)
      delegate_to: localhost
      ansible.builtin.command:
        cmd: kubectl wait node --all --for=condition=Ready=False --timeout=300s
      environment:
        KUBECONFIG: "{{ playbook_dir }}/../../kubeconfig"
      register: nodes_ready
      until: nodes_ready.rc == 0
      retries: 10
      delay: 30
      when: talos_bootstrap | bool
      changed_when: false

- name: Bootstrap Flux via helmfile
  hosts: localhost
  gather_facts: false
  tags: [flux]
  vars:
    repo_dir: "{{ playbook_dir }}/../.."
    kubeconfig_path: "{{ playbook_dir }}/../../kubeconfig"
  tasks:
    # ── Retrieve secrets from 1Password if not present locally ───────────────
    - name: "Retrieve age.key from 1Password (item: sops / SOPS_PRIVATE_KEY)"
      ansible.builtin.shell: >
        op item get "{{ op_sops_item }}"
        --fields label="{{ op_sops_field }}"
        --reveal
        > {{ repo_dir }}/age.key
      args:
        creates: "{{ repo_dir }}/age.key"
      no_log: true

    - name: "Retrieve 1password-credentials.json from 1Password (item: 1password / OP_CREDENTIALS_JSON)"
      ansible.builtin.shell: >
        op item get "{{ op_1password_item }}"
        --fields label="{{ op_1password_credentials_field }}"
        --reveal
        > {{ repo_dir }}/1password-credentials.json
      args:
        creates: "{{ repo_dir }}/1password-credentials.json"
      no_log: true

    - name: Check age.key exists
      ansible.builtin.stat:
        path: "{{ repo_dir }}/age.key"
      register: age_key

    - name: Fail if age.key missing
      ansible.builtin.fail:
        msg: "age.key introuvable — vérifier item '{{ op_sops_item }}' champ '{{ op_sops_field }}' dans 1Password"
      when: not age_key.stat.exists

    # ── Check if Flux is already installed ───────────────────────────────────
    - name: Check if Flux is already installed
      ansible.builtin.command: flux check
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: flux_check
      failed_when: false
      changed_when: false

    # ── Install Flux (idempotent — skipped if already running) ───────────────
    - name: Install Flux
      when: flux_check.rc != 0
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
        SOPS_AGE_KEY_FILE: "{{ repo_dir }}/age.key"
      block:
        - name: Create flux-system namespace
          ansible.builtin.command:
            cmd: kubectl create namespace flux-system --dry-run=client -o yaml
          register: ns_flux_yaml
          changed_when: false

        - name: Apply flux-system namespace
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ ns_flux_yaml.stdout }}"
          changed_when: true

        - name: Create external-secrets namespace
          ansible.builtin.command:
            cmd: kubectl create namespace external-secrets --dry-run=client -o yaml
          register: ns_es_yaml
          changed_when: false

        - name: Apply external-secrets namespace
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ ns_es_yaml.stdout }}"
          changed_when: true

        - name: Create sops-age secret in flux-system
          ansible.builtin.command:
            cmd: >
              kubectl create secret generic sops-age
              --namespace=flux-system
              --from-file=age.agekey={{ repo_dir }}/age.key
              --dry-run=client -o yaml
          register: sops_secret_yaml
          changed_when: false

        - name: Apply sops-age secret
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ sops_secret_yaml.stdout }}"
          changed_when: true

        - name: Create 1Password credentials secret in external-secrets
          ansible.builtin.command:
            cmd: >
              kubectl create secret generic onepassword-credentials
              --namespace=external-secrets
              --from-file=1password-credentials.json={{ repo_dir }}/1password-credentials.json
              --dry-run=client -o yaml
          register: op_secret_yaml
          changed_when: false

        - name: Apply 1Password credentials secret
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ op_secret_yaml.stdout }}"
          changed_when: true

        - name: Run helmfile bootstrap (cilium → coredns → cert-manager → external-secrets → 1password → flux)
          ansible.builtin.command:
            cmd: helmfile apply
            chdir: "{{ repo_dir }}/bootstrap/helmfile.d"
          changed_when: true

    - name: Wait for Flux to reconcile cluster-apps
      ansible.builtin.command:
        cmd: flux reconcile kustomization cluster-apps --with-source --timeout=5m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: flux_reconcile
      until: flux_reconcile.rc == 0
      retries: 5
      delay: 30
      changed_when: false
