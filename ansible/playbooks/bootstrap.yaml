---
# Bootstrap complet du cluster Talos + Flux depuis zéro.
# Prérequis : talosctl, kubectl, flux, helmfile CLI installés (gérés via mise)
#
# Usage:
#   ansible-playbook ansible/playbooks/bootstrap.yaml
#   ansible-playbook ansible/playbooks/bootstrap.yaml --tags talos   # seulement Talos
#   ansible-playbook ansible/playbooks/bootstrap.yaml --tags flux    # seulement Flux

- name: Generate Talos configs
  hosts: localhost
  gather_facts: false
  tags: [talos, configs]
  tasks:
    - name: Check talconfig.yaml exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../talos/talconfig.yaml"
      register: talconfig

    - name: Fail if talconfig.yaml missing
      ansible.builtin.fail:
        msg: "talos/talconfig.yaml not found"
      when: not talconfig.stat.exists

    - name: Generate Talos configs via talhelper
      ansible.builtin.command:
        cmd: talhelper genconfig
        chdir: "{{ playbook_dir }}/../../talos"
      changed_when: true

- name: Apply Talos configs to nodes
  hosts: kubernetes
  gather_facts: false
  serial: 1
  tags: [talos, apply]
  tasks:
    - name: Apply config to node (insecure — first apply)
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          talosctl apply-config
          --nodes {{ ansible_host }}
          --file {{ talos_config_dir }}/{{ cluster_name }}-{{ inventory_hostname }}.yaml
          --insecure
      changed_when: true

    - name: Wait for node API to be ready
      delegate_to: localhost
      ansible.builtin.command:
        cmd: talosctl version --nodes {{ ansible_host }}
      register: version_check
      until: version_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: Bootstrap etcd
  hosts: kubernetes
  gather_facts: false
  tags: [talos, etcd]
  tasks:
    - name: Bootstrap etcd on first control-plane
      delegate_to: localhost
      ansible.builtin.command:
        cmd: talosctl bootstrap --nodes {{ ansible_host }}
      when: talos_bootstrap | bool
      register: bootstrap_result
      changed_when: bootstrap_result.rc == 0
      failed_when:
        - bootstrap_result.rc != 0
        - '"etcd is already bootstrapped" not in bootstrap_result.stderr'

    - name: Retrieve kubeconfig
      delegate_to: localhost
      ansible.builtin.command:
        cmd: talosctl kubeconfig --nodes {{ ansible_host }} --force
      register: kubeconfig_result
      until: kubeconfig_result.rc == 0
      retries: 30
      delay: 10
      when: talos_bootstrap | bool
      changed_when: true

    - name: Wait for all nodes to be Ready
      delegate_to: localhost
      ansible.builtin.command:
        cmd: kubectl wait node --all --for=condition=Ready --timeout=300s
      register: nodes_ready
      until: nodes_ready.rc == 0
      retries: 10
      delay: 30
      when: talos_bootstrap | bool
      changed_when: false

- name: Bootstrap Flux via helmfile
  hosts: localhost
  gather_facts: false
  tags: [flux]
  tasks:
    - name: Check age.key exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../age.key"
      register: age_key

    - name: Fail if age.key missing
      ansible.builtin.fail:
        msg: "age.key not found at repo root — required for SOPS decryption"
      when: not age_key.stat.exists

    - name: Create flux-system namespace
      ansible.builtin.command:
        cmd: kubectl create namespace flux-system --dry-run=client -o yaml
      register: ns_yaml
      changed_when: false

    - name: Apply flux-system namespace
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ ns_yaml.stdout }}"
      changed_when: true

    - name: Create sops-age secret in flux-system
      ansible.builtin.command:
        cmd: >
          kubectl create secret generic sops-age
          --namespace=flux-system
          --from-file=age.agekey={{ playbook_dir }}/../../age.key
          --dry-run=client -o yaml
      register: sops_secret_yaml
      changed_when: false

    - name: Apply sops-age secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ sops_secret_yaml.stdout }}"
      changed_when: true

    - name: Create 1Password credentials secret
      ansible.builtin.command:
        cmd: >
          kubectl create secret generic onepassword-credentials
          --namespace=external-secrets
          --from-file=1password-credentials.json={{ playbook_dir }}/../../1password-credentials.json
          --dry-run=client -o yaml
      register: op_secret_yaml
      changed_when: false

    - name: Apply 1Password credentials secret
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ op_secret_yaml.stdout }}"
      changed_when: true

    - name: Run helmfile bootstrap (cilium → coredns → cert-manager → external-secrets → 1password → flux)
      ansible.builtin.command:
        cmd: helmfile apply
        chdir: "{{ playbook_dir }}/../../bootstrap/helmfile.d"
      changed_when: true

    - name: Wait for Flux to reconcile cluster-apps
      ansible.builtin.command:
        cmd: flux reconcile kustomization cluster-apps --with-source --timeout=5m
      register: flux_reconcile
      until: flux_reconcile.rc == 0
      retries: 5
      delay: 30
      changed_when: false
