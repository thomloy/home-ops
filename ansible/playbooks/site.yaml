---
# Déploiement complet de l'infrastructure depuis zéro.
# Ordre : prérequis → réseau (OPNsense) → NAS (TrueNAS) → cluster (Talos + Flux)
#
# Usage:
#   ansible-playbook playbooks/site.yaml
#   ansible-playbook playbooks/site.yaml --tags flux       # seulement Flux
#   ansible-playbook playbooks/site.yaml --tags network    # seulement OPNsense
#   ansible-playbook playbooks/site.yaml --tags nas        # seulement TrueNAS

- name: "Check prerequisites"
  import_playbook: prereqs.yaml

- name: "Configure network (OPNsense)"
  import_playbook: network.yaml

- name: "Configure NAS (TrueNAS SCALE)"
  import_playbook: nas.yaml

- name: "Bootstrap cluster (Talos + Flux)"
  import_playbook: bootstrap.yaml
