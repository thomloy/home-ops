---
# Configuration TrueNAS SCALE via API REST v2.
# Crée les datasets ZFS, exports NFS et shares SMB.
#
# Usage (depuis le répertoire ansible/, ou via task runner) :
#   task ansible:nas
#   ansible-playbook playbooks/nas.yaml
#   ansible-playbook playbooks/nas.yaml --tags nfs   # seulement NFS
#
# Prérequis:
#   1. Créer un API key dans TrueNAS : profil utilisateur (haut droite) > API Keys
#   2. Stocker dans 1Password (item: truenas, champ: TRUENAS_API_KEY)
#   3. ansible-galaxy collection install -r requirements.yaml

- name: Configure TrueNAS SCALE
  hosts: nas
  gather_facts: false
  vars:
    api_headers:
      Authorization: "Bearer {{ truenas_api_key }}"
      Content-Type: "application/json"

  tasks:
    # ── Datasets ZFS ──────────────────────────────────────────────────────────
    - name: Create ZFS parent datasets
      tags: [datasets]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/pool/dataset"
        method: POST
        headers: "{{ api_headers }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          comments: "{{ item.comments | default('') }}"
          atime: "off"
          compression: "lz4"
        status_code: [200, 201, 422]  # 422 = already exists
        validate_certs: false
      loop: "{{ truenas_datasets }}"
      loop_control:
        label: "{{ item.name }}"
      register: dataset_result
      changed_when: dataset_result.status == 200

    - name: Create ZFS child datasets
      tags: [datasets]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/pool/dataset"
        method: POST
        headers: "{{ api_headers }}"
        body_format: json
        body:
          name: "{{ item.1.name }}"
          comments: "{{ item.1.comments | default('') }}"
          atime: "off"
          compression: "lz4"
        status_code: [200, 201, 422]
        validate_certs: false
      loop: "{{ truenas_datasets | subelements('children', skip_missing=True) }}"
      loop_control:
        label: "{{ item.1.name }}"
      register: child_result
      changed_when: child_result.status == 200

    # ── Services NFS ──────────────────────────────────────────────────────────
    - name: Enable NFS service
      tags: [nfs]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/service/id/nfs"
        method: PUT
        headers: "{{ api_headers }}"
        body_format: json
        body:
          enable: true
        validate_certs: false
      changed_when: false

    - name: Start NFS service
      tags: [nfs]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/service/start"
        method: POST
        headers: "{{ api_headers }}"
        body_format: json
        body:
          service: "nfs"
        validate_certs: false
      changed_when: false

    - name: Get existing NFS shares
      tags: [nfs]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/sharing/nfs"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: false
      register: existing_nfs

    - name: Create NFS shares
      tags: [nfs]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/sharing/nfs"
        method: POST
        headers: "{{ api_headers }}"
        body_format: json
        body:
          path: "{{ item.path }}"
          comment: "{{ item.comment }}"
          networks: "{{ item.networks }}"
          maproot_user: "{{ item.maproot_user | default('root') }}"
          maproot_group: "{{ item.maproot_group | default('wheel') }}"
          enabled: true
        status_code: [200, 201]
        validate_certs: false
      loop: "{{ truenas_nfs_shares }}"
      loop_control:
        label: "{{ item.path }}"
      when: item.path not in (existing_nfs.json | map(attribute='path') | list)
      changed_when: true

    # ── Services SMB ──────────────────────────────────────────────────────────
    - name: Enable SMB service
      tags: [smb]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/service/id/cifs"
        method: PUT
        headers: "{{ api_headers }}"
        body_format: json
        body:
          enable: true
        validate_certs: false
      changed_when: false

    - name: Get existing SMB shares
      tags: [smb]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/sharing/smb"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: false
      register: existing_smb

    - name: Create SMB shares
      tags: [smb]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/sharing/smb"
        method: POST
        headers: "{{ api_headers }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          path: "{{ item.path }}"
          comment: "{{ item.comment | default('') }}"
          browsable: "{{ item.browsable | default(true) }}"
          readonly: "{{ item.readonly | default(false) }}"
          enabled: true
        status_code: [200, 201]
        validate_certs: false
      loop: "{{ truenas_smb_shares }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in (existing_smb.json | map(attribute='name') | list)
      changed_when: true

    # ── Graphite reporting → graphite-exporter (Prometheus/Grafana) ──────────
    - name: Configure TrueNAS graphite reporting
      tags: [monitoring]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/reporting/config"
        method: PUT
        headers: "{{ api_headers }}"
        body_format: json
        body:
          graphite: "{{ graphite_ip }}"
          graphite_port: 2003
          graph_age: 12
          graph_points: 1200
        validate_certs: false
      changed_when: false

    # ── ZFS scrub hebdomadaire ────────────────────────────────────────────────
    - name: Configure weekly ZFS scrub
      tags: [scrub]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/pool/scrub"
        method: POST
        headers: "{{ api_headers }}"
        body_format: json
        body:
          pool: "{{ truenas_pool }}"
          threshold: 35
          description: "Weekly scrub"
          schedule:
            minute: "0"
            hour: "0"
            dom: "*"
            month: "*"
            dow: "0"
          enabled: true
        status_code: [200, 201, 422]
        validate_certs: false
      changed_when: false

    # ── Snapshots automatiques ────────────────────────────────────────────────
    - name: Create snapshot task for kubernetes datasets
      tags: [snapshots]
      ansible.builtin.uri:
        url: "{{ truenas_api_url }}/pool/snapshottask"
        method: POST
        headers: "{{ api_headers }}"
        body_format: json
        body:
          dataset: "{{ truenas_pool }}/kubernetes"
          recursive: true
          lifetime_value: 7
          lifetime_unit: "DAY"
          naming_schema: "auto-%Y-%m-%d_%H-%M"
          schedule:
            minute: "0"
            hour: "2"
            dom: "*"
            month: "*"
            dow: "*"
          enabled: true
        status_code: [200, 201, 422]
        validate_certs: false
      changed_when: false
